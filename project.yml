# XcodeGen spec — run `xcodegen generate`, then open AMSWorkoutSync.xcodeproj.
#
# Stage 1 of the native app: it reads the training plan and never writes it.
# The web app (../AMS Workout Sync) stays the one that logs, until the Swift
# writer has been proven to produce the same workbook the web app does.
name: AMSWorkoutSync
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WorkoutCore:
    path: Core
targets:
  AMSWorkoutSync:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: WorkoutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutSync
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: Workout Sync
        CFBundleName: AMS Workout Sync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: false
