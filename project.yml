# XcodeGen spec — run `xcodegen generate`, then open AMSWorkoutSync.xcodeproj.
#
# Stage 1 of the native app: it reads the training plan and never writes it.
# The web app (../AMS Workout Sync) stays the one that logs, until the Swift
# writer has been proven to produce the same workbook the web app does.
name: AMSWorkoutSync
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.19.1"
    CURRENT_PROJECT_VERSION: "96"
packages:
  WorkoutCore:
    path: Core
  # The shared AMS icon hub: every mark this app draws comes from it (its own drawings live there as the tri… marks).
  AMSIcons:
    url: https://github.com/marsch124/AMS-Icons
    revision: 2c5c095593a9d1367f745beabbfa69a02bd355c0
targets:
  AMSWorkoutSync:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    entitlements:
      path: App/Config/AMSWorkoutSync.entitlements
      properties:
        # HealthKit must never be dropped (30 Sep 2026: builds 40-46 lost it).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # 2.1: the plan is shared through the app's own iCloud folder (hidden from Files on purpose).
        com.apple.developer.icloud-container-identifiers: [iCloud.com.schabbauer.AMSWorkoutSync]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.schabbauer.AMSWorkoutSync]
    dependencies:
      - package: WorkoutCore
      - package: AMSIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutSync
        # iPhone and iPad; the Mac runs the iPad app ("Designed for iPad"). Once on App Store Connect, iPad cannot be dropped again.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Config/AMSWorkoutSync.entitlements
    info:
      path: App/Config/Info.plist
      properties:
        # The name under the icon is short so iOS does not cut it; the full
        # name, AMS Triathlon Training, is on TestFlight and inside the app.
        # Up to 1.1 the app was called Workout Sync. Bundle id, URL scheme and
        # target names keep the old word on purpose: same app, same data.
        CFBundleDisplayName: Triathlon
        CFBundleName: AMS Triathlon Training
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Apple refuses an iPad app without all four (error 90474).
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.schabbauer.amsworkoutsync
            CFBundleURLSchemes: [amsworkoutsync]
        # Is Workouts / Magic Morning installed? (Only asked, never read from.)
        LSApplicationQueriesSchemes: [amsworkouts, amsmorning]
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: To keep your sessions in a Training calendar — added, moved and removed as the plan changes. Full access is what iOS requires for an app to update events it made itself.
        NSCameraUsageDescription: To take a photograph of a session and keep it beside the plan. Photographs stay on this device.
        NSLocationWhenInUseUsageDescription: To show the weather and daylight for today's outdoor session.
        NSHealthUpdateUsageDescription: AMS Triathlon Training never writes anything to Health. Apple requires this text to be present anyway.
        NSHealthShareUsageDescription: AMS Triathlon Training reads the workouts, heart rate and distances your watch sent to Health, so a session can be logged by checking the numbers instead of typing them, and so hikes and gym sessions outside the plan count in your load. Nothing is written to Health.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
  AMSWorkoutSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AMSWorkoutSync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSWorkoutSyncUITests
        TEST_TARGET_NAME: AMSWorkoutSync
schemes:
  AMSWorkoutSync:
    build:
      targets:
        AMSWorkoutSync: all
    test:
      targets:
        - AMSWorkoutSyncUITests
