/* Chapter 10 — Reminders and away. Settings › Reminders (three reminders, the iOS question, the notice and its buttons, the Sunday card,
   the refused line), the weather switch beside it, and Settings › Away (a trip, what you have there, what Today and the cards say,
   taking the trip away). All state keys start with rem_, screens with rem., actions with rem. */
CHAPTER({
  id: 'rem',
  title: 'Reminders and away',
  icon: 'bell',
  needs: 'Which reminders you want and at what time, and for a trip: the days, and what you will have there (pool, bike, gym, open water).',
  gives: 'A word the evening before, on Sunday and the morning after a missed session; and a plan that knows when you cannot swim, ride or lift. You still decide every change.',
  start: () => ({
    part: 'settings', screen: 'rem.settings',
    rem_ev: false, rem_evt: '20:00', rem_su: false, rem_sut: '18:00', rem_mi: false, rem_mit: '08:00',
    rem_perm: 'unasked', rem_saved: false, rem_tested: false, rem_opened: false, rem_seen: [], rem_card: true, rem_wx: true, rem_wxtouched: false,
    rem_aw_on: false, rem_aw_from: 'Mon 21 Sep', rem_aw_until: 'Wed 23 Sep', rem_aw_pool: false, rem_aw_bike: false, rem_aw_gym: false, rem_aw_ow: false,
    rem_aw_saved: false, rem_aw_gone: false, rem_take: false, rem_keep: false,
  }),
  screens: {
    /* The middle of Settings: Your plan (Suggestions, Away) and the Reminders group with the Weather switch under it. */
    'rem.settings': S => {
      const any = S.rem_saved && (S.rem_ev || S.rem_su || S.rem_mi);
      return `
      <h1 class="k-h1">Settings</h1>
      <span class="k-cap">Your plan</span>
      ${K.nav('Suggestions', 'rem.note', { sub: 'On — the app suggests, you decide' })}
      ${K.nav('Away', 'rem.openaway', { t: 'rem.awayrow', sub: S.rem_aw_saved ? `Until ${S.rem_aw_until} — sessions you cannot do there are marked` : 'Off — for a trip: say what you will have there' })}
      <span class="k-cap">Reminders</span>
      ${K.nav('Reminders', 'rem.open', { t: 'rem.row', sub: any ? 'On — evening, Sunday, missed session' : 'Off — evening, Sunday, missed session' })}
      <span class="k-cap">Weather</span>
      <div class="k-card">${K.switch(S.rem_wx, 'Weather and daylight on Today', 'rem.wx', { t: 'rem.wx' })}
        <span class="k-muted k-small">For an outdoor session: the forecast and when it gets dark. Your place is asked only when Today first needs it, and only a rounded place, about 10 km wide, is sent.</span></div>`; },

    /* Settings › Reminders */
    'rem.page': S => {
      const block = (title, sw, tkey, times, sends, id, label) => `<div class="k-card"><b>${title}</b>
        ${K.switch(S['rem_' + id], 'Switch on', 'rem.sw', { arg: id, t: 'rem.sw.' + id })}
        <div class="k-line ${S['rem_' + id] ? '' : 'rem-off'}"><span class="k-muted">${label}</span>${K.select(tkey, S, times, { t: 'rem.t.' + id })}</div>
        <span class="k-muted k-small">${sends}</span></div>`;
      const n = [S.rem_ev, S.rem_su, S.rem_mi].filter(Boolean).length;
      return `
      <div class="k-top">${K.btn('Cancel', 'rem.cancel', { t: 'rem.cancel' })}<span class="k-sp"></span>${K.btn('Save', 'rem.save', { t: 'rem.save' })}</div>
      <h1 class="k-h1">Reminders</h1>
      ${K.hero({ cap: 'REMINDERS', title: n + ' switched on', lines: ['On this iPhone only'], t: 'rem.head' })}
      ${S.rem_perm === 'refused' ? `<div class="k-card" data-t="rem.refused"><span>Notifications are switched off for this app in iOS, so no reminder can appear. Nothing else is affected.</span>
        ${K.btn('Open iOS settings', 'rem.ios', { t: 'rem.ios' })}</div>` : ''}
      ${block('Evening reminder', 0, 'rem_evt', ['19:00', '20:00', '21:00', '22:00'], 'Tomorrow’s session in one line, like “Tomorrow: Run · 45 min easy”. Tapping it opens Today.', 'ev', 'Sent at')}
      ${block('Sunday card', 0, 'rem_sut', ['17:00', '18:00', '19:00', '20:00'], 'On Sunday evening: “Next week: 7 sessions · 8h 40m”. From then until Monday morning Today shows next week day by day, with a Close button.', 'su', 'Sent at')}
      ${block('Missed session', 0, 'rem_mit', ['07:00', '08:00', '09:00', '10:00'], 'The morning after a planned session that is neither logged nor marked missed: “Yesterday’s Run was not logged.” with Skip it, Move to today (when your plan allows it) and It is done. Each one is your own tap.', 'mi', 'Asked at')}
      ${K.btn('Send a test now', 'rem.test', { main: true, t: 'rem.test' })}
      <span class="k-muted k-small">Nothing is sent while the stop sign or an illness is on. These switches belong to this iPhone: your other devices have their own. Reminders are worked out on the device from your plan; nothing goes through a server.</span>`; },

    /* What a notice looks like when it arrives. rem_note: 'evening' | 'missed' | 'test' */
    'rem.notice': S => `
      <h1 class="k-h1">A notice arrives</h1>
      <div class="k-card rem-notice"><span class="k-cap">Triathlon</span><b>${S.rem_note === 'missed' ? 'Training' : 'Training'}</b>
        <span>${S.rem_note === 'missed' ? 'Yesterday’s Run was not logged.' : S.rem_note === 'test' ? 'This is a test. Your reminders will look like this.' : 'Tomorrow: Run · 45 min easy'}</span></div>
      ${S.rem_note === 'missed' ? `<div class="k-col">
        ${K.btn('Skip it', 'rem.answer', { arg: 'skip', t: 'rem.a.skip' })}
        ${K.btn('Move to today', 'rem.answer', { arg: 'move', t: 'rem.a.move' })}
        ${K.btn('It is done', 'rem.answer', { arg: 'done', t: 'rem.a.done' })}</div>
        <span class="k-muted k-small">${S.rem_seen.includes('skip') ? 'Skip it: the session is marked missed, as with the Missed button. ' : ''}${S.rem_seen.includes('move') ? 'Move to today: the session moves to today, as with the Move button. ' : ''}${S.rem_seen.includes('done') ? 'It is done: the app opens that session with its log form.' : ''}</span>` : `<span class="k-muted k-small">Tapping it opens Today.</span>`}`,

    /* Today on the Sunday evening: the card for next week */
    'rem.sunday': S => `
      <h1 class="k-h1">Today</h1>
      ${S.rem_card ? `<div class="rem-sun" data-t="rem.card">
        <div class="rem-sunhead"><span class="rem-sunrow"><b>NEXT WEEK</b><button class="rem-close" data-act="rem.close" data-t="rem.close">Close</button></span>
          <span class="rem-sunrow"><span class="rem-bigfig">4</span><b>sessions</b><span class="rem-bigfig rem-fig2">2h 45m</span></span><b>Build</b></div>
        <div class="rem-sunbody">
          ${[['Mon', 'swim', 'Endurance swim', '40m'], ['Tue', 'run', 'Easy run + 4x20 s strides', '35m'], ['Thu', 'bike', 'Easy ride', '1h'], ['Sat', 'strength', 'Strength', '30m']].map(r => `<span class="k-line"><b class="rem-day">${r[0]}</b>${K.sport(r[1])}<span class="k-col rem-words"><b>${r[2]}</b><span class="k-muted k-small">${r[3]}</span></span></span>`).join('')}</div></div>` : `<p class="k-muted">The card is put away until next Sunday.</p>`}
      <div class="k-card"><b>This week</b><span class="k-muted">1h 16m of 3h 40m</span>${K.bar(35)}</div>`,

    /* Settings › Away */
    'rem.away': S => {
      const miss = [['pool', 'pool'], ['bike', 'bike'], ['gym', 'gym'], ['ow', 'open water']].filter(x => !S['rem_aw_' + x[0]]).map(x => 'no ' + x[1]).join(', ');
      const shown = S.rem_aw_on ? 'Away until ' + S.rem_aw_until : 'Not away';
      const sub = S.rem_aw_on ? (miss ? miss[0].toUpperCase() + miss.slice(1) : 'You have everything there') : 'Switch it on for a trip, and say what you will have there';
      return `
      <div class="k-top">${K.btn('Cancel', 'rem.awcancel', { t: 'rem.awcancel' })}<span class="k-sp"></span>${K.btn('Save', 'rem.awsave', { t: 'rem.awsave' })}</div>
      <h1 class="k-h1">Away</h1>
      ${K.hero({ cap: 'AWAY', title: shown, lines: [sub], t: 'rem.awhead' })}
      <div class="k-card">${K.switch(S.rem_aw_on, 'I am away', 'rem.awsw', { t: 'rem.awsw' })}
        <div class="k-field ${S.rem_aw_on ? '' : 'rem-off'}"><label for="in-rem_aw_from">From</label>${K.select('rem_aw_from', S, ['Mon 21 Sep', 'Tue 22 Sep'], { t: 'rem.awfrom' })}</div>
        <div class="k-field ${S.rem_aw_on ? '' : 'rem-off'}"><label for="in-rem_aw_until">Until</label>${K.select('rem_aw_until', S, ['Tue 22 Sep', 'Wed 23 Sep', 'Sun 27 Sep'], { t: 'rem.awuntil' })}</div>
        <span class="k-muted k-small">Until is your last day away. Sessions you cannot do there get a grey note, and the app may suggest a swap; nothing in your plan changes until you tap Take it.</span></div>
      <div class="k-card ${S.rem_aw_on ? '' : 'rem-off'}"><span class="k-cap rem-slate">What I have there</span>
        ${K.switch(S.rem_aw_pool, 'Pool', 'rem.awhas', { arg: 'pool', t: 'rem.awhas.pool' })}
        ${K.switch(S.rem_aw_bike, 'Bike (or turbo)', 'rem.awhas', { arg: 'bike', t: 'rem.awhas.bike' })}
        ${K.switch(S.rem_aw_gym, 'Gym', 'rem.awhas', { arg: 'gym', t: 'rem.awhas.gym' })}
        ${K.switch(S.rem_aw_ow, 'Open water', 'rem.awhas', { arg: 'ow', t: 'rem.awhas.ow' })}
        <span class="k-muted k-small">Switch on only what you will really have. Everything left off counts as missing.</span></div>`; },

    /* Today on Monday 21 September, inside the trip (no pool, no gym) */
    'rem.todayaway': S => `
      <h1 class="k-h1">Today</h1>
      <button class="rem-line" data-act="rem.awayline" data-t="rem.awline">Away until Wed 23 Sep · no pool, no gym, no open water</button>
      <div class="k-card"><span class="k-line">${K.sport('swim')}<span class="k-col rem-words"><span class="k-sportword k-sp-swim">Swim</span><b>Endurance swim</b>
        <span class="k-line">${K.chip('40m')}${K.chip('Z2')}${K.chip('No pool while away', { t: 'rem.chip' })}</span></span></span></div>
      ${S.rem_take ? `<div class="k-card" data-t="rem.cardtaken"><span class="k-line"><b>Changed —</b><span class="k-link">Undo</span></span><span class="k-muted k-small">Mon swim: no pool while away ${icon('right')} easy run 40 min (swim moves to Thu)</span></div>`
        : S.rem_keep ? `<p class="k-muted k-small" data-t="rem.cardkept">The card is gone and nothing in your plan changed. Settings › Suggestions keeps your answer, Kept my plan.</p>`
        : `<div class="k-card" data-t="rem.sugg"><b>Mon swim: no pool while away ${icon('right')} easy run 40 min (swim moves to Thu)</b>
        <span class="k-muted k-small">Why: you are away until 23 Sep without a pool; an easy run keeps the day aerobic.</span>
        <div class="k-line">${K.btn('Take it', 'rem.take', { t: 'rem.take' })}${K.btn('Keep my plan', 'rem.keep', { t: 'rem.keep' })}</div>
        <span class="k-link rem-other">Other choice</span></div>`}
      <div class="k-card"><span class="k-line">${K.sport('strength')}<span class="k-col rem-words"><span class="k-sportword k-sp-strength">Strength</span><b>Strength</b>
        <span class="k-line">${K.chip('30m')}${K.chip('No gym while away', { t: 'rem.chipgym' })}</span></span></span></div>`,
  },
  sheets: {
    /* iOS's own question, asked when the first reminder is switched on */
    'rem.ask': S => `<h3>Allow notifications?</h3>
      <p class="k-muted">This is iOS asking, not the app: may Triathlon send you notices?</p>
      <div class="k-foot">${K.btn('Don’t Allow', 'rem.deny', { t: 'rem.deny' })}${K.btn('Allow', 'rem.allow', { main: true, t: 'rem.allow' })}</div>`,
  },
  actions: {
    'rem.note'() { toast('Suggestions has its own chapter.'); },
    'rem.open'(arg, S) { S.screen = 'rem.page'; },
    'rem.cancel'(arg, S) { S.screen = 'rem.settings'; },
    'rem.sw'(arg, S) {
      const k = 'rem_' + arg;
      S[k] = !S[k];
      if (S[k] && S.rem_perm === 'unasked') S.sheet = 'rem.ask';
    },
    'rem.allow'(arg, S) { S.rem_perm = 'ok'; S.sheet = null; },
    'rem.deny'(arg, S) { S.rem_perm = 'refused'; S.sheet = null; },
    'rem.save'(arg, S) { S.rem_saved = true; S.screen = 'rem.settings'; toast('Saved. The Settings row says what is on.'); },
    'rem.test'(arg, S) { S.rem_tested = true; if (S.rem_perm === 'unasked') { S.sheet = 'rem.ask'; } else { toast('A test notice arrives: “This is a test. Your reminders will look like this.”'); } },
    'rem.ios'(arg, S) { S.rem_opened = true; toast('iOS Settings opens on this app. Switch Notifications on there.'); },
    'rem.answer'(arg, S) { if (!S.rem_seen.includes(arg)) S.rem_seen.push(arg); },
    'rem.close'(arg, S) { S.rem_card = false; },
    'rem.wx'(arg, S) { S.rem_wx = !S.rem_wx; S.rem_wxtouched = true; },
    'rem.openaway'(arg, S) { S.screen = 'rem.away'; },
    'rem.awcancel'(arg, S) { S.screen = 'rem.settings'; },
    'rem.awsw'(arg, S) { S.rem_aw_on = !S.rem_aw_on; },
    'rem.awhas'(arg, S) { const k = 'rem_aw_' + arg; S[k] = !S[k]; },
    'rem.awsave'(arg, S) {
      if (S.rem_aw_on) { S.rem_aw_saved = true; S.rem_aw_gone = false; toast('Saved. Away is on and follows you to your other devices.'); }
      else if (S.rem_aw_saved) { S.rem_aw_saved = false; S.rem_aw_gone = true; toast('The trip is taken away.'); }
      S.screen = 'rem.settings';
    },
    'rem.awayline'() { toast('This opens the Away page.'); },
    'rem.take'(arg, S) { S.rem_take = true; },
    'rem.keep'(arg, S) { S.rem_keep = true; },
  },
  steps: [
    { kind: 'look', head: 'Two ways the app looks after you', target: 'rem.row', real: 'Settings › Reminders, Settings › Away',
      text: 'Reminders can tell you about tomorrow, about next week and about a session you forgot to log. Away tells the plan you are on a trip. Both are in Settings, and both are off until you switch them on.' },
    { kind: 'try', head: 'Open Reminders', text: 'Press <b>Reminders</b>.', target: 'rem.row',
      until: S => S.screen === 'rem.page', ok: 'The page is open. At the top is a slate card that counts the switches that are on, and says it is for this iPhone only.', robot: [['act', 'rem.open']] },
    { kind: 'look', head: 'Three reminders', shot: 'rem-01-reminders',
      text: 'There are three: <b>Evening reminder</b>, <b>Sunday card</b> and <b>Missed session</b>. Each has its switch, its time and a line that says what it sends. At the top, the slate card counts the switches that are on, for this iPhone only.',
      hint: 'They start at 20:00, 18:00 and 08:00. The green button sends a test at once.' },
    { kind: 'try', head: 'Switch one on and let iOS ask', set: { screen: 'rem.page' },
      text: 'Switch on <b>Evening reminder</b>. The first switch you turn on makes iOS ask whether the app may send notices. Press <b>Allow</b>.',
      target: S => S.sheet ? 'rem.allow' : 'rem.sw.ev',
      until: S => S.rem_ev && S.rem_perm === 'ok', ok: 'iOS has your answer. The time can be changed now; before, it was greyed.', robot: [['act', 'rem.sw', 'ev'], ['act', 'rem.allow']] },
    { kind: 'try', head: 'Choose when it comes', set: { screen: 'rem.page', rem_ev: true, rem_perm: 'ok' },
      text: 'Choose <b>21:00</b> for the evening reminder.', target: 'rem.t.ev',
      until: S => S.rem_evt === '21:00', ok: 'It now arrives at 21:00, with tomorrow’s session in one line.', robot: [['in', 'rem_evt', '21:00']] },
    { kind: 'look', head: 'What the evening notice says', set: { screen: 'rem.notice', rem_note: 'evening' },
      text: 'The title is <b>Training</b> and the line is tomorrow’s session: sport, length and how hard. Two sessions read “Tomorrow: Swim 40 min · Strength 30 min”; a rest day reads “Tomorrow: rest day”. Seven evenings are laid ahead.' },
    { kind: 'try', head: 'The missed-session question', set: { screen: 'rem.notice', rem_note: 'missed' }, target: S => ['skip', 'move', 'done'].filter(a => !S.rem_seen.includes(a)).map(a => 'rem.a.' + a)[0] || 'rem.a.skip',
      text: 'The morning after a session you neither logged nor marked missed, this comes. Press <b>Skip it</b>, <b>Move to today</b> and <b>It is done</b>, one after the other.',
      hint: 'Move to today is left out when your plan does not allow it. Up to three sessions are asked each morning.',
      until: S => ['skip', 'move', 'done'].every(a => S.rem_seen.includes(a)), ok: 'Each button is your own tap: skip marks it missed, move brings it to today, done opens the session with its log form.',
      robot: [['act', 'rem.answer', 'skip'], ['act', 'rem.answer', 'move'], ['act', 'rem.answer', 'done']] },
    { kind: 'try', head: 'The Sunday card on Today', set: { part: 'today', screen: 'rem.sunday' }, target: 'rem.close',
      text: 'The Sunday reminder says “Next week: 7 sessions · 8h 40m”. From then until Monday morning Today shows next week day by day in a blue card. Press <b>Close</b> to put it away.',
      until: S => !S.rem_card, ok: 'The card is put away until next Sunday. It shows only while the Sunday switch is on.', robot: [['act', 'rem.close']] },
    { kind: 'look', head: 'When iOS has said no', shot: 'rem-02-refused',
      text: 'If you told iOS no, or notices are switched off for the app, a calm line at the top says so: no reminder can appear, nothing else is affected. Its button <b>Open iOS settings</b> takes you to this app’s page there.' },
    { kind: 'try', head: 'Test it, then save', set: { screen: 'rem.page', rem_ev: true, rem_su: true, rem_perm: 'ok' }, target: S => S.rem_tested ? 'rem.save' : 'rem.test',
      text: 'Press <b>Send a test now</b>: a notice arrives at once, so you see how they look. Then press <b>Save</b>. Cancel would leave everything as it was.',
      until: S => S.rem_tested && S.rem_saved, ok: 'Saved. The Settings row now says On, and Today shows the Sunday card on Sundays.', robot: [['act', 'rem.test'], ['act', 'rem.save']] },
    { kind: 'try', head: 'The weather switch', set: { screen: 'rem.settings' }, target: 'rem.wx',
      text: 'Under Reminders is <b>Weather and daylight on Today</b>, on from the start. For an outdoor session Today shows the forecast and when it gets dark. Switch it off.',
      hint: 'Your place is asked once, when Today first needs it, and only a rounded place, about 10 km wide, is sent.',
      until: S => !S.rem_wx, ok: 'Today shows no weather line now. Like the reminders, this switch belongs to this device.', robot: [['act', 'rem.wx']] },
    { kind: 'look', head: 'The Away page', shot: 'rem-03-away-page', real: 'Settings › Your plan › Away',
      text: 'The slate card says <b>Away until</b> and what you lack there (here no pool, no gym). Under it: the switch <b>I am away</b>, <b>From</b> and <b>Until</b> (your last day away), and four switches for what you have: Pool, Bike (or turbo), Gym and Open water.',
      hint: 'There is also a small Away button at the top of Settings › Suggestions.' },
    { kind: 'try', head: 'Tell the app you are away', set: { screen: 'rem.settings' }, text: 'Press <b>Away</b>. Switch on <b>I am away</b>, then say what you will have there: switch on <b>Bike (or turbo)</b>. Then press <b>Save</b>.',
      target: S => S.screen === 'rem.settings' ? 'rem.awayrow' : !S.rem_aw_on ? 'rem.awsw' : !S.rem_aw_bike ? 'rem.awhas.bike' : 'rem.awsave',
      hint: 'Left off counts as missing: here no pool, no gym, no open water.',
      until: S => S.rem_aw_saved && S.rem_aw_bike, ok: 'The Away row now says Until Wed 23 Sep. The trip is kept for all your devices, and nothing in your plan has changed.',
      robot: [['act', 'rem.openaway'], ['act', 'rem.awsw'], ['act', 'rem.awhas', 'bike'], ['act', 'rem.awsave']] },
    { kind: 'look', head: 'Today while away', shot: 'rem-05-today-away',
      text: 'Under the heading one grey line says <b>Away until</b> and what is missing; press it to open the page. Below, the app has a suggestion for a swim you cannot do: an easy run instead. Further down, a session you cannot do carries a grey note such as <b>No pool while away</b>.' },
    { kind: 'try', head: 'A suggestion, and you decide', set: { part: 'today', screen: 'rem.todayaway' }, target: 'rem.take',
      text: 'The app may suggest what to do with a session you cannot do: an easy swap, a later day or rest. Nothing changes until you press <b>Take it</b>. <b>Keep my plan</b> is an answer too. Press <b>Take it</b>.',
      until: S => S.rem_take, ok: 'The plan has changed, and says so. Undo is there until the end of the day. The easy week and the limits still apply: some trips give a note and no card.', robot: [['act', 'rem.take']] },
    { kind: 'look', head: 'Strength without a gym', shot: 'rem-06-nogym',
      text: 'A strength session without a gym gets the grey note and no card, because there is nothing to swap. Its own page has a button <b>No-gym version</b>: a circuit with no equipment, shown here. It changes nothing in your plan. “A session’s page” teaches it.' },
    { kind: 'try', head: 'Take the trip away', set: { screen: 'rem.away', rem_aw_on: true, rem_aw_saved: true, rem_aw_bike: true }, target: S => S.rem_aw_on ? 'rem.awsw' : 'rem.awsave',
      text: 'Back home? Open the Away page, switch <b>I am away</b> off and press <b>Save</b>.',
      until: S => S.rem_aw_gone, ok: 'The trip is gone from every device. The notes and the grey line go with it.', robot: [['act', 'rem.awsw'], ['act', 'rem.awsave']] },
    { kind: 'check', head: 'A trip with no pool', text: 'You set Away for Monday to Wednesday and leave Pool and Open water off. What changes in your plan?',
      answers: ['The Monday swim is swapped for an easy run', 'Nothing, until you press Take it on a card', 'Every swim in those days is moved to Thursday'], right: 1,
      ok: 'Right. The swim gets a grey note, and the app may offer a swap. Only your Take it changes the plan.' },
    { kind: 'check', head: 'What follows you', text: 'You set both on your iPhone: the evening reminder at 21:00 and an Away trip. What do your iPad and Mac have?',
      answers: ['Both', 'The reminder only', 'The Away trip only: each device has its own reminders'], right: 2,
      ok: 'Right. Reminders and the weather switch belong to one device. Away travels with you.' },
  ],
});

/* ===== 11-rac.js ===== */
/* Chapter 11 — Race day, shoes and bikes. The race page (opened from Progress; its head card and headings are the race's red, its buttons the plan's blue),
   and Settings › Race and kit › Shoes and bikes. State keys rac_, screens rac., actions rac. The race is the app's own invented sample:
   "Half-distance triathlon", 228 days ahead of Wednesday 16 September 2026, which is Sunday 2 May 2027. */
const RAC_GROUPS = [['before', 'Before', ['Race number', 'Timing chip', 'Sun cream', 'Watch charged']], ['swim', 'Swim', ['Wetsuit', 'Goggles', 'Swim cap', 'Spare goggles']],
  ['bike', 'Bike', ['Helmet', 'Bike shoes', 'Bottles', 'Gels', 'Sunglasses']], ['run', 'Run', ['Running shoes', 'Race belt', 'Cap', 'Gels for the run']],
  ['after', 'After', ['Dry clothes', 'Flip-flops', 'Towel', 'Recovery drink']]];
const RAC_LEGS = [['swim', 'Swim', false], ['t1', 'T1', true], ['bike', 'Bike', false], ['t2', 'T2', true], ['run', 'Run', false]];
const racPad = n => String(n).padStart(2, '0');
/* "1:10" or "70" -> seconds for a leg; "4:30" -> seconds for a change-over; empty -> null; not a time -> false */
function racParse(text, co) {
  const t = String(text || '').trim().toLowerCase(); if (!t) return null;
  if (t.includes(':')) { const p = t.split(':').map(x => parseInt(x, 10)); if (p.some(isNaN)) return false;
    if (p.length === 2) return co ? p[0] * 60 + p[1] : p[0] * 3600 + p[1] * 60; if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2]; return false; }
  const n = Number(t); return isNaN(n) ? false : Math.round(n * 60);
}
function racWords(s, co) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (co) return h > 0 ? `${h}h ${racPad(m)}m` : m > 0 ? (sec > 0 ? `${m}m ${racPad(sec)}s` : `${m}m`) : `${sec}s`;
  return h > 0 ? `${h}h ${racPad(m)}m` : `${m}m`;
}
const racGrams = (rows, leg) => rows.filter(r => r.leg === leg).reduce((a, r) => a + r.carbs, 0);
const racPacked = S => RAC_GROUPS.reduce((n, g) => n + S['rac_k_' + g[0]].filter(i => S.rac_packed.includes(i.id)).length, 0);
const racTotal = S => RAC_GROUPS.reduce((n, g) => n + S['rac_k_' + g[0]].length, 0);
const racN = n => Number(n).toLocaleString('en-GB');
const racBtn = (label, a, o = {}) => `<button class="rac-btn${o.main ? ' rac-main' : ''}${o.danger ? ' rac-danger' : ''}" data-act="${a}"${o.arg !== undefined ? ` data-arg="${esc(o.arg)}"` : ''}${o.t ? ` data-t="${o.t}"` : ''}>${esc(label)}</button>`;

      const dist = { swim: '1.9 km', bike: '90 km', run: '21.1 km' };

        ${S['rac_k_' + g[0]].map(i => `<button class="rac-tick" data-act="rac.tick" data-arg="${i.id}" data-t="rac.tick:${i.id}">${S.rac_packed.includes(i.id) ? `<span class="rac-on">${icon('check')}</span>` : `<span class="rac-ring"></span>`}<span>${esc(i.name)}</span></button>`).join('')}</div>`).join('')}
      <span class="k-muted k-small">A tick means packed.</span>
      <div class="k-line">${racBtn('Untick all', 'rac.untickask', { danger: true, t: 'rac.untick' })}${racBtn('Change the list', 'rac.lopen', { t: 'rac.lopen' })}</div>`;
    },

    /* Settings › Race and kit › Shoes and bikes */
    'rac.gear': S => {
      const inUse = S.rac_g.filter(g => g.on).length, aside = S.rac_g.length - inUse;

        : `<span class="rac-gbar"><i style="width:${Math.max(3, Math.round(g.km / g.limit * 100))}%"></i></span><b class="k-small">${racN(g.km)} of ${racN(g.limit)} km</b>`) : '';
      return `
      <div class="k-top">${K.back('Settings', 'rac.note')}</div>
      <h1 class="k-h1">Shoes and bikes</h1>
      ${K.hero({ cap: 'SHOES AND BIKES', title: inUse + ' in use', lines: aside ? [aside + ' put aside'] : [], t: 'rac.ghead' })}
      ${S.rac_g.map(g => `<div class="rac-gtile" data-t="rac.g.${g.id}"><span class="rac-gk">${g.kind.toUpperCase()}</span>
        <b>${esc(g.name)} · ${g.km} km</b>
        <span class="k-muted k-small">${g.on ? 'In use since ' + g.since : 'Not in use now'}</span><span class="k-muted k-small">${g.words}</span>${bar(g)}
        <span class="k-line">${g.kind === 'Other' ? '' : g.on ? `<button class="rac-small" data-act="rac.aside" data-arg="${g.id}" data-t="rac.aside.${g.id}">Put aside</button>` : `<button class="rac-small" data-act="rac.use" data-arg="${g.id}" data-t="rac.use.${g.id}">Use from today</button>`}
        <button class="rac-small" data-act="rac.gchange" data-arg="${g.id}" data-t="rac.change.${g.id}">Change</button></span></div>`).join('')}
      ${K.btn('Add shoes or a bike', 'rac.gadd', { main: true, t: 'rac.gadd' })}`;
    },
  },
  sheets: {
    'rac.pace': S => {
      const bad = RAC_LEGS.filter(l => racParse(S['rac_t_' + l[0]], l[2]) === false).map(l => l[0]);
      const ps = RAC_LEGS.map(l => racParse(S['rac_t_' + l[0]], l[2])).filter(v => typeof v === 'number'), sum = ps.reduce((a, b) => a + b, 0);
      return `<h3>Your times</h3>
      <span class="k-muted k-small">Type the time you plan for each part. Legs as hours and minutes (1:10), change-overs as minutes and seconds (4:30). Leave a box empty to leave it out.</span>
      ${RAC_LEGS.map(l => `<div class="k-field"><label for="in-rac_t_${l[0]}">${l[1]}</label><span class="k-col">${K.input('rac_t_' + l[0], S, { ph: l[2] ? 'e.g. 4:30' : 'e.g. 1:10', t: 'rac.t.' + l[0] })}
        ${l[2] ? '' : K.input('rac_n_' + l[0], S, { ph: 'How you will hold it, e.g. pulse Z2', t: 'rac.n.' + l[0] })}
        ${bad.includes(l[0]) ? '<span class="k-muted k-small">That is not a time yet.</span>' : ''}</span></div>`).join('')}
      ${ps.length ? `<b>Planned finish ${dur(Math.round(sum / 60))}</b>` : ''}
      <div class="k-foot">${K.btn('Cancel', 'sheet.close')}${K.btn('Save', 'rac.psave', { main: true, t: 'rac.psave', off: bad.length > 0 })}</div>`;
    },
    'rac.row': S => `<h3>New fuel row</h3>
      ${K.seg([['before', 'Before'], ['bike', 'Bike'], ['run', 'Run']], S.rac_r_leg, 'rac.rleg', 'rac.rleg')}
      <div class="k-field"><label for="in-rac_r_when">When</label>${K.input('rac_r_when', S, { ph: 'e.g. every 20 min', t: 'rac.rwhen' })}</div>
      <div class="k-field"><label for="in-rac_r_what">What</label>${K.input('rac_r_what', S, { ph: 'e.g. 1 gel', t: 'rac.rwhat' })}</div>
      <div class="k-field"><label for="in-rac_r_g">Carbohydrate, grams in all</label>${K.input('rac_r_g', S, { num: true, ph: 'e.g. 198', t: 'rac.rg' })}</div>
      <span class="k-muted k-small">The grams for this row over the whole part, as you will take them.</span>
      <div class="k-foot">${K.btn('Cancel', 'sheet.close')}${K.btn('Save', 'rac.rsave', { main: true, t: 'rac.rsave' })}</div>`,
    'rac.fuel': S => `<h3>Fuel plan</h3>
      <span class="k-muted k-small">Hold the three lines and drag a row to where it belongs. Tap a row to change it.</span>
      <div class="k-card">${S.rac_fe.map((r, i) => `<div class="k-dragrow" data-drag="rac_fe" data-i="${i}">
        <button class="k-grip" data-grip aria-label="Drag to arrange" data-t="rac.fgrip:${i}">${icon('grip')}</button>
        <button class="rac-pick" data-act="rac.fchange" data-t="rac.fchange:${i}"><span>${r.carbs} g ${esc(r.what)}</span><span class="k-muted k-small">${{ before: 'Before', bike: 'Bike', run: 'Run' }[r.leg]}${r.when ? ' · ' + esc(r.when) : ''}</span></button>
        <button class="rac-rm" data-act="rac.frm" data-arg="${r.id}" data-t="rac.frm:${i}">Remove</button></div>`).join('')}</div>
      <div class="k-foot">${K.btn('Cancel', 'sheet.close')}${K.btn('Save', 'rac.fsave', { main: true, t: 'rac.fsave' })}</div>`,
    'rac.list': S => `<h3>Kit checklist</h3>
      <span class="k-muted k-small">Hold the three lines and drag an item to where it belongs. Rename it in its box.</span>
      ${RAC_GROUPS.map(g => `<div class="rac-kgroup"><span class="rac-tn">${g[1].toUpperCase()}</span>
        ${S['rac_e_' + g[0]].map((i, n) => `<div class="k-dragrow" data-drag="rac_e_${g[0]}" data-i="${n}"><button class="k-grip" data-grip aria-label="Drag to arrange" data-t="rac.lgrip.${g[0]}:${n}">${icon('grip')}</button>
          <span class="k-name rac-pick">${esc(i.name) || '<span class="k-muted">Item</span>'}</span><button class="rac-rm" data-act="rac.lrm" data-arg="${i.id}" data-t="rac.lrm:${i.id}">Remove</button></div>`).join('')}
        <button class="rac-add" data-act="rac.ladd" data-arg="${g[0]}" data-t="rac.ladd.${g[0]}">Add to ${g[1].toLowerCase()}</button></div>`).join('')}
      <div class="k-foot">${K.btn('Cancel', 'sheet.close')}${K.btn('Save', 'rac.lsave', { main: true, t: 'rac.lsave' })}</div>`,
    'rac.untick': S => `<h3>Untick all ${racPacked(S)} packed items?</h3>
      <div class="k-foot">${K.btn('Keep them', 'sheet.close')}${K.btn('Untick all', 'rac.unticknow', { danger: true, t: 'rac.unticknow' })}</div>`,
    /* Shoes and bikes: add (rac_gedit '') or change (an id) */
    'rac.gform': S => `<h3>${S.rac_gedit ? 'Change' : 'New'}</h3>
      <div class="k-field"><label for="in-rac_gname">Name</label>${K.input('rac_gname', S, { ph: 'e.g. Blue runners', t: 'rac.gname' })}</div>
      <div class="k-field"><label for="in-rac_gkind">Kind</label>${K.select('rac_gkind', S, ['Running shoes', 'Bike', 'Other'], { t: 'rac.gkind' })}</div>
      ${S.rac_gedit ? '' : `<div class="k-card">${K.switch(S.rac_gnow, 'In use now', 'rac.gnow', { t: 'rac.gnow' })}</div>`}
      <div class="k-field"><label for="in-rac_gstart">Kilometres it already had</label>${K.input('rac_gstart', S, { num: true, ph: '0', t: 'rac.gstart' })}</div>
      <div class="k-field"><label for="in-rac_glimit">Look at it again at … km (optional)</label>${K.input('rac_glimit', S, { num: true, ph: 'e.g. 700', t: 'rac.glimit' })}</div>
      ${S.rac_gedit ? `<div class="k-line"><button class="rac-small" data-act="rac.gask" data-arg="retire" data-t="rac.retire">Retire</button><button class="rac-small rac-rm" data-act="rac.gask" data-arg="remove" data-t="rac.remove">Remove</button></div>` : ''}
      ${S.rac_gask === 'remove' ? `<div class="k-band k-needs" data-t="rac.askbox"><span>Remove ${esc(S.rac_gname)}? It is taken off all your devices and cannot be brought back.</span></div><div class="k-line">${racBtn('Remove', 'rac.gdo', { danger: true, arg: 'remove', t: 'rac.gdo' })}${racBtn('Keep it', 'rac.gask', { arg: '' })}</div>` : ''}
      ${S.rac_gask === 'retire' ? `<div class="k-band k-needs" data-t="rac.askbox"><span>Retire ${esc(S.rac_gname)}? It moves to Retired with its final figure.</span></div><div class="k-line">${racBtn('Retire', 'rac.gdo', { arg: 'retire', t: 'rac.gdo' })}${racBtn('Keep using it', 'rac.gask', { arg: '' })}</div>` : ''}
      <div class="k-foot">${K.btn('Cancel', 'sheet.close')}${K.btn('Save', 'rac.gsave', { main: true, t: 'rac.gsave', off: !S.rac_gname.trim() })}</div>`,
  },
  actions: {
    'rac.note'() { toast('Settings has its own chapter.'); },
    'rac.open'(arg, S) { S.screen = 'rac.page'; },
    'rac.close'(arg, S) { S.screen = 'rac.progress'; },
    'rac.pace'(arg, S) { S.sheet = 'rac.pace'; },
    'rac.psave'(arg, S) {
      RAC_LEGS.forEach(l => { const v = racParse(S['rac_t_' + l[0]], l[2]); S.rac_p[l[0]] = typeof v === 'number' ? v : null; });
      ['swim', 'bike', 'run'].forEach(k => { S.rac_pn[k] = S['rac_n_' + k].trim(); });
      S.rac_pace_done = true; S.sheet = null;
    },
    'rac.fadd'(arg, S) { S.sheet = 'rac.row'; },
    'rac.rleg'(arg, S) { S.rac_r_leg = arg; },
    'rac.rsave'(arg, S) { S.rac_fuel.push({ id: 'n' + S.rac_fuel.length, leg: S.rac_r_leg, when: S.rac_r_when.trim(), what: S.rac_r_what.trim(), carbs: parseInt(S.rac_r_g, 10) || 0 }); S.sheet = null; },
    'rac.fopen'(arg, S) { S.rac_fe = S.rac_fuel.map(r => ({ ...r })); S.sheet = 'rac.fuel'; },
    'rac.fchange'() { toast('The row opens with Cancel and Save, as Add a row does.'); },
    'rac.frm'(arg, S) { S.rac_fe = S.rac_fe.filter(r => r.id !== arg); },
    'rac.fsave'(arg, S) { S.rac_fuel = S.rac_fe.map(r => ({ ...r })); S.sheet = null; },
    'rac.tick'(arg, S) { const i = S.rac_packed.indexOf(arg); if (i < 0) S.rac_packed.push(arg); else S.rac_packed.splice(i, 1); },
    'rac.untickask'(arg, S) { if (S.rac_packed.length) S.sheet = 'rac.untick'; else toast('Untick all is greyed while nothing is packed.'); },
    'rac.unticknow'(arg, S) { S.rac_packed = []; S.sheet = null; },
    'rac.lopen'(arg, S) { RAC_GROUPS.forEach(g => { S['rac_e_' + g[0]] = S['rac_k_' + g[0]].map(i => ({ ...i })); }); S.sheet = 'rac.list'; },
    'rac.lrm'(arg, S) { RAC_GROUPS.forEach(g => { S['rac_e_' + g[0]] = S['rac_e_' + g[0]].filter(i => i.id !== arg); }); },
    'rac.ladd'(arg, S) { S['rac_e_' + arg].push({ id: arg + '-new' + S['rac_e_' + arg].length, name: '' }); },
    'rac.lsave'(arg, S) { RAC_GROUPS.forEach(g => { S['rac_k_' + g[0]] = S['rac_e_' + g[0]].map(i => ({ ...i })); }); S.rac_listsaved = true; S.sheet = null; },
    'rac.aside'(arg, S) { const g = S.rac_g.find(x => x.id === arg); if (g) g.on = false; },
    'rac.use'(arg, S) { const g = S.rac_g.find(x => x.id === arg); if (!g) return; S.rac_g.forEach(x => { if (x.kind === g.kind) x.on = false; }); g.on = true; g.since = 'Wed 16 Sep'; },
    'rac.gadd'(arg, S) { S.rac_gedit = ''; S.rac_gname = ''; S.rac_gkind = 'Running shoes'; S.rac_gstart = ''; S.rac_glimit = ''; S.rac_gnow = true; S.rac_gask = ''; S.sheet = 'rac.gform'; },
    'rac.gnow'(arg, S) { S.rac_gnow = !S.rac_gnow; },
    'rac.gchange'(arg, S) {
      const g = S.rac_g.find(x => x.id === arg); if (!g) return;
      S.rac_gedit = arg; S.rac_gname = g.name; S.rac_gkind = g.kind; S.rac_gstart = String(g.km); S.rac_glimit = g.limit ? String(g.limit) : ''; S.rac_gask = ''; S.sheet = 'rac.gform';
    },
    'rac.gask'(arg, S) { S.rac_gask = arg; },
    'rac.gdo'(arg, S) { if (arg === 'remove') S.rac_g = S.rac_g.filter(x => x.id !== S.rac_gedit); else { const g = S.rac_g.find(x => x.id === S.rac_gedit); if (g) { g.on = false; g.name += ' (retired)'; } } S.sheet = null; },
    'rac.gsave'(arg, S) {
      const km = parseFloat(S.rac_gstart) || 0, lim = parseFloat(S.rac_glimit) || 0;
      if (S.rac_gedit) { const g = S.rac_g.find(x => x.id === S.rac_gedit); if (g) { g.name = S.rac_gname.trim(); g.kind = S.rac_gkind; g.km = km; g.limit = lim; } }
      else {
        if (S.rac_gnow && S.rac_gkind !== 'Other') S.rac_g.forEach(x => { if (x.kind === S.rac_gkind) x.on = false; });
        S.rac_g.push({ id: 'g' + (S.rac_g.length + 1) + 'n', name: S.rac_gname.trim(), kind: S.rac_gkind, on: S.rac_gnow, since: 'Wed 16 Sep', km, limit: lim, words: S.rac_gkind === 'Other' ? 'Counts only the kilometres you gave it' : (S.rac_gkind === 'Bike' ? 'No rides logged yet' : 'No runs logged yet') });
      }
      S.sheet = null;
    },

/* Chapter 12 — Claude. Settings › Claude: the key, the switch, the meter, the log; Claude among the suggestion's choices;
   "Your week with Claude" on Today; "Ask about your plan"; "Export for Claude". Every word is the app's own (ClaudeSettingsView,
   ClaudeReviewView, ClaudeAskView, SuggestionCard, core ClaudeTrouble / ClaudeReview / ClaudeAsk). All figures and answers are invented. */
const CLA_ARROW = () => icon('right');
const CLA_ILL = /\b(ill|sick|fever|pain|hurt|injur|ache|chest)/i;
const CLA_ANSWER = 'Thursday is the lighter day between the Wednesday run and the long ride on Saturday, so the plan keeps it short and easy. The rule book does not let a suggestion make a session longer. If you want it different, use Move or Change on that session; the app will show one grey line if it breaks a rule, and you can still go on.';
const CLA_DOCTOR = 'That is a question for a doctor. The app’s Stop sign page is under Not well? at the foot of Today.';
const CLA_EXAMPLES = ['Why is Thursday’s ride only 45 minutes?', 'What does this week’s easy week change?', 'Can I move Saturday’s long run to Sunday?'];
const CLA_LINES = ['Most of the planned bike and run minutes were done; the swim was the lightest part.',
  'Mornings were mixed: two Good, two OK, one Tired and two without an answer.',
  'The long ride felt harder than its plan said; the other sessions felt as planned.',
  'One run was missed and one session moved to another day.',
  'Next week starts with a rest day and keeps the same number of sessions.'];
CHAPTER({
  id: 'cla',
  title: 'Claude',
  icon: 'talk',
  needs: 'Nothing. Claude is optional and needs your own Anthropic key; without one the app works by its rules alone.',
  gives: 'Claude may choose among the suggestion’s options, write your week on Sunday and answer a question about your plan. It never changes the plan.',
  start: () => ({ part: 'settings', screen: 'cla.page', cla_key: false, cla_on: false, cla_typed: '', cla_prob: '', cla_card: 'rule',
    cla_touch: false, cla_week: 'before', cla_q: '', cla_items: [], cla_shared: false }),
  screens: {

    'cla.page': S => `
      ${K.back('Settings', 'cla.back')}
      <b class="cla-title">Claude</b>
      <div class="k-card k-muted k-small"><p class="cla-line">It picks among the choices the rule book offers and words the reason. It changes nothing; you still tap.</p>
        <p class="cla-line">Nothing else is sent: not your name, notes, session titles, photographs, tests, zones, weight, or the Health and Garmin morning numbers.</p>
        <p class="cla-line">It costs about a dollar a month, never more than 5 US dollars a month. The app stops asking when the month reaches it.</p></div>
      ${S.cla_key ? `<div class="k-card"><b class="k-oktext">Key saved</b><span class="k-muted k-small">••••••••••••</span></div>
        <div><button class="k-btn k-danger" data-act="cla.remove" data-t="cla.remove"><span>Remove the key</span></button></div>`
      : `${K.input('cla_typed', S, { ph: 'Type your Anthropic key', t: 'cla.key' })}
        ${S.cla_prob ? `<span class="k-small k-failtext">${esc(S.cla_prob)}</span>` : ''}
        <div class="k-line">${K.btn('Cancel', 'cla.cancel')}${K.btn('Save', 'cla.save', { main: true, t: 'cla.save' })}</div>`}
      <div class="k-card">${K.switch(S.cla_on, 'Let Claude choose among the suggestions', 'cla.on', { t: 'cla.on', off: !S.cla_key })}
        ${S.cla_key ? '' : '<span class="k-muted k-small">Needs a key first.</span>'}</div>
      <b class="k-small" data-t="cla.month">${S.cla_key ? 'This month: 0.12 US dollars of 5.00 · 6 answers' : 'This month: 0.00 US dollars of 5.00 · 0 answers'}</b>
      <span class="k-cap">What Claude answered</span>
      ${S.cla_key ? `<div class="k-card"><b class="k-small">16 Sep, 07:12 · Chose: Mon swim: no pool while away ${CLA_ARROW()} easy run 35 min</b>
        <span class="k-small">Why: you are away until 19 Sep without a pool; an easy run keeps the day aerobic.</span><span class="k-muted k-small">0.02 US dollars</span></div>`
      : '<span class="k-muted k-small">Nothing yet.</span>'}`,
    /* The same page further down: the export row. */
    'cla.export': S => `

      <b class="cla-title">Claude</b>
      <span class="k-cap">Export for Claude</span>
      <div class="k-card"><span class="k-muted k-small">Your season as plain text: the phases, your tests and zones, the last 8 weeks and the next 4. Paste it into the Claude app to talk it over. This sends nothing by itself.</span>
        <div>${K.btn('Share the plan as text', 'cla.share', { t: 'cla.share', icon: 'share' })}</div></div>
      ${S.cla_shared ? `<div class="k-band k-ok">${icon('info')}<span>The usual Send menu opens (Messages, Mail, AirDrop). The text goes nowhere until you choose one.</span></div>` : ''}

            <button class="k-btn k-main k-full" data-act="cla.write" data-t="cla.write"><span>Write my week</span></button></div>`}</div>`,

    'cla.ask': S => `

      <span class="k-muted k-small">Your question, this week and the next two weeks of the plan (day, sport, minutes, effort), the phase, the rule book’s limits in words, and the names of your zones — no figures, no names, no notes. It counts toward the 5 US dollars a month.</span>

      <button class="k-btn k-main k-full" data-act="cla.send" data-t="cla.send"${S.cla_q.trim() ? '' : ' disabled'}><span>Ask</span></button>
      ${S.cla_items.length ? `<span class="k-cap">Your last questions</span>

          <span class="k-small">${esc(it.a)}</span>${it.local ? '<span class="k-muted k-small">Answered by the app. Nothing was sent.</span>' : ''}</div>`).join('')}
        <div>${K.btn('Clear', 'cla.clear', { danger: true, t: 'cla.clear' })}</div>` : ''}`,

  },
  actions: {
    'cla.back'() { toast('Settings has its own chapter.'); },

      S.cla_key = true; S.cla_typed = ''; S.cla_prob = '';

    'cla.on'(a, S) { if (S.cla_key) S.cla_on = !S.cla_on; },
    'cla.remove'(a, S) { S.sheet = 'cla.confirm'; },

/* ===== 13-gar.js ===== */
/* Chapter 13 — Garmin and Health. Where the numbers come from: Settings › Garmin (the key), the morning numbers on Today and their plate,
   Apple Health (iPhone), the Training calendar the iPhone writes, and the two neighbour apps. Taught only as far as the screens say it:
   Garmin's real answers could not be proven before the release. Words from GarminSettingsView, MorningNumbersView, SettingsView,
   SessionView, Neighbours, TodayView. All figures are invented. */

/* A row in Settings: the title, a grey line, at most one small button on the right. */
function garRow(title, sub, o = {}) {
  return `<div class="gar-row${o.t ? ' gar-press' : ''}"${o.act ? ` data-act="${o.act}"` : ''}${o.t ? ` data-t="${o.t}"` : ''}>
    <span class="k-col gar-words"><b>${esc(title)}</b><span class="k-muted k-small">${esc(sub)}</span></span>
    ${o.btn ? `<button class="k-btn ${o.danger ? 'k-danger' : 'k-out'} gar-small" data-act="${o.btn[1]}" data-t="${o.btn[2] || ''}">${esc(o.btn[0])}</button>` : ''}
    ${o.chev ? icon('right') : ''}</div>`;
}

/* The Garmin line on Today: names grey, figures bold, a bracket on HRV and Resting. */
function garLine() {
  return `<span class="gar-line"><span class="k-muted">HRV </span><b>64</b> <span class="k-oktext">(+3)</span><span class="k-muted"> · Sleep </span><b>7h 20m</b><span class="k-muted"> · Resting </span><b>47</b> <span class="k-oktext">(−2)</span><span class="k-muted"> · Body Battery </span><b>71</b></span>`;
}

/* One card on the plate: the name first and the figure right beside it, the normal under it. */
function garCard(name, fig, brk, under) {
  return `<div class="k-card gar-card"><span class="k-line gar-fig"><span class="k-muted">${name}</span><b>${fig}</b>${brk ? `<span class="k-oktext">${brk}</span>` : ''}</span>
    <span class="k-muted k-small">${under}</span></div>`;
}

function setList(S, id, withHead) {
  const picked = S.set_pick ? SET_ROWS[S.set_pick] : null;
  const row = key => {
    const r = SET_ROWS[key];
    if (key === 'weather') return `<div class="k-card"><b class="k-small">${esc(r[0])}</b><span class="k-muted k-small">${esc(r[1])}</span></div>`;
    return K.nav(r[0], 'set.pick', { arg: key, sub: r[1], t: 'set.row:' + key });
  };
  const extra = id === 'set.l3' ? `<span class="k-cap">This app</span>${K.nav('How this works', 'set.guide', { sub: 'The week strip, logging, syncing and what keeps your plan safe', t: 'set.row:guide' })}
      ${K.nav('What’s new', 'set.new', { sub: 'AMS Triathlon Training 2.12 (88)', t: 'set.row:new' })}` : '';
  return `${withHead ? '<h1 class="k-h1">Settings</h1>' : ''}
    ${picked ? `<div class="k-band k-ok" data-t="set.card">${icon('info')}<span class="k-small"><b>${esc(picked[0])}</b> — ${esc(picked[2])} ${picked[3] ? 'Taught in: ' + esc(picked[3]) + '.' : ''}</span></div>` : ''}
    ${SET_GROUPS[id].map(([g, keys]) => `<span class="k-cap">${esc(g)}</span>${keys.map(row).join('')}`).join('')}${extra}`;
}

        'On the iPad or the Mac: the <b>Keys</b> plate, and the keys it lists.',
        'Printing a week or a month on paper.',
      ] },
  ],
};
/* ui.js — the course itself: chapter rail, coach card, the pretend iPhone or iPad on the page. */
const stage = document.getElementById('stage'), coach = document.getElementById('coach'), fin = document.getElementById('finish');
const KEY = 'triathlon-course';
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const readList = k => { try { return JSON.parse(store.get(k) || '[]'); } catch { return []; } };
let doneCh = new Set(readList(KEY + '-done'));
let solved = false, robotMode = false;
const timers = [];
laterImpl = (fn, ms) => { if (robotMode) return fn(); const h = setTimeout(() => { fn(); paint(); checkSolved(); }, ms); timers.push(h); return h; };
const clearTimers = () => { while (timers.length) clearTimeout(timers.pop()); };
toastHook = () => { paint(); clearTimeout(toastHook.h); toastHook.h = setTimeout(() => { S.toast = ''; paint(); }, 2800); };

const step = () => CHAPTERS[ci] && CHAPTERS[ci].steps[si];
const totalSteps = () => CHAPTERS.reduce((n, c) => n + c.steps.length, 0);

/* ---------- The pretend window on the page ---------- */
function paint(fresh) {
  const keep = sel => { const e = stage.querySelector(sel); return e ? e.scrollTop : 0; };
  const a = fresh ? 0 : keep('.pane'), b = fresh ? 0 : keep('.k-sheet');
  stage.innerHTML = stageHTML(); fit();
  const p = stage.querySelector('.pane'); if (p) p.scrollTop = a;
  const s = stage.querySelector('.k-sheet'); if (s) s.scrollTop = b;
  markTarget();
}
function reveal(el) {
  const box = el.closest('.k-sheet') || el.closest('.pane'); if (!box || box === el) return;
  const k = box.getBoundingClientRect().height / box.offsetHeight || 1, a = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  if (a.top < b.top || a.bottom > b.bottom) box.scrollTop += (a.top - b.top) / k - 70;
}
function markTarget() {
  stage.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  const st = step(); if (!st || (solved && st.kind !== 'look')) return;
  const t = typeof st.target === 'function' ? st.target(S) : st.target;
  [].concat(t || []).forEach((n, i) => { const el = stage.querySelector(`[data-t="${CSS.escape(n)}"]`); if (el) { el.classList.add('target'); if (i === 0) reveal(el); } });
}
function checkSolved() {
  const st = step(); if (!st || solved || st.kind !== 'try' || !st.until) return;
  let ok = false; try { ok = !!st.until(S); } catch { ok = false; }
  if (ok) succeed(st.ok || 'Done.');
}
function succeed(msg) {
  solved = true;
  const fb = document.getElementById('fb'); if (fb) { fb.innerHTML = icon('check') + '<span>' + esc(msg).replace(/&lt;(\/?)b&gt;/g, '<$1b>') + '</span>'; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}

stage.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled || !stage.contains(el)) return;
  act(el.dataset.act, el.dataset.arg, el); paint(); checkSolved();
});
function setIn(el) {
  const k = el.dataset.in, text = el.tagName === 'INPUT' && el.type !== 'checkbox';
  let pos = null; try { pos = el.selectionStart; } catch {}
  typeIn(k, el.type === 'checkbox' ? el.checked : el.value); paint();
  const n = stage.querySelector(`[data-in="${CSS.escape(k)}"]`);
  if (n && text) { n.focus({ preventScroll: true }); try { if (pos != null) n.setSelectionRange(pos, pos); } catch {} }
  checkSolved();
}
stage.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && el.tagName !== 'SELECT' && el.type !== 'checkbox') setIn(el); });
stage.addEventListener('change', e => { const el = e.target.closest('select[data-in], input[type="checkbox"][data-in]'); if (el) setIn(el); });

/* Drag to arrange: press the grip of a row, let go over another row of the same list. */
let drag = null;
const rowAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest ? el.closest(`[data-drag="${CSS.escape(drag.key)}"]`) : null; };
stage.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-grip]'), row = g && g.closest('[data-drag]'); if (!row) return;
  e.preventDefault(); drag = { key: row.dataset.drag, from: +row.dataset.i }; row.classList.add('k-dragging');
});
window.addEventListener('pointermove', e => { if (!drag) return; stage.querySelectorAll('.k-dropat').forEach(x => x.classList.remove('k-dropat')); const r = rowAt(e); if (r) r.classList.add('k-dropat'); });
window.addEventListener('pointerup', e => { if (!drag) return; const r = rowAt(e), d = drag; drag = null; if (r) dragMove(d.key, d.from, +r.dataset.i); paint(); checkSolved(); });

document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const c = CHAPTERS[ci];
  if (c && c.actions && c.actions.key && fin.hidden) {
    const before = JSON.stringify(S); act('key', e.key);
    if (JSON.stringify(S) !== before) { e.preventDefault(); paint(); checkSolved(); return; }
  }
  if (e.key === 'Enter') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});

/* ---------- Rail, coach, moving on ---------- */
function renderRail() {
  const total = totalSteps(), before = CHAPTERS.slice(0, ci).reduce((n, c) => n + c.steps.length, 0) + (ci < CHAPTERS.length ? si : 0);
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="apptile">${icon('triathlon')}</span><div><h1>Triathlon Training Course</h1><small>${CHAPTERS.length} chapters · ${total} steps · your pace</small></div></div>
    <div class="chaps">${CHAPTERS.map((c, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneCh.has(c.id) ? 'done' : ''}" data-ch="${i}">${icon(c.icon)}<span>${esc(c.title)}</span><span class="n">${doneCh.has(c.id) ? icon('check') : c.steps.length}</span></button>`).join('')}
    <button class="chap ${ci === CHAPTERS.length ? 'cur' : ''}" data-ch="${CHAPTERS.length}">${icon('trophy')}<span>${esc(FINALE ? FINALE.title : 'On your own devices')}</span></button></div>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / Math.max(total, 1))}%"></i></div>
    <p class="railnote">Everything here is a practice copy with an invented plan. Nothing changes in your real app or your real plan.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i, s = 0) { ci = Math.max(0, Math.min(i, CHAPTERS.length)); si = s; renderStep(); }
function renderStep() {
  clearTimers(); renderRail();
  store.set(KEY + '-at', JSON.stringify([ci, si]));
  if (ci >= CHAPTERS.length) { coach.hidden = true; document.getElementById('stagebox').hidden = true; document.querySelector('.main').classList.remove('dev-phone'); renderFinish(); return; }
  coach.hidden = false; fin.hidden = true; document.getElementById('stagebox').hidden = false;
  const c = CHAPTERS[ci], st = c.steps[si];
  S = stateFor(ci, si); solved = st.kind === 'look';
  const kind = st.shot ? 'Look · the real app' : { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  const first = si === 0 && (c.needs || c.gives);
  coach.innerHTML = `<div class="eyebrow">${icon(c.icon)}<span>${esc(c.title)}</span><span class="kind">${kind} · step ${si + 1} of ${c.steps.length}</span>${st.only ? `<span class="only">${esc(st.only)}</span>` : ''}</div>
    <div class="say"><h2>${esc(st.head)}</h2><p>${st.text}</p>${st.hint ? `<p class="hint">${st.hint}</p>` : ''}
      ${first ? `<div class="deal">${c.needs ? `<div><b>What it needs from you</b><span>${c.needs}</span></div>` : ''}${c.gives ? `<div><b>What you get</b><span>${c.gives}</span></div>` : ''}</div>` : ''}
      ${st.real ? `<p class="real">${icon('pin')}<span>In your real app: ${esc(st.real)}</span></p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}${st.kind === 'try' ? '<button class="btn ghost" id="again">Start this step again</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === c.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  paint(true);
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok || 'Right.'); }
    else { b.classList.add('wrong'); fb.textContent = st.no || 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
  const ag = document.getElementById('again'); if (ag) ag.onclick = renderStep;
}
function next() {
  const c = CHAPTERS[ci];
  if (si < c.steps.length - 1) { si++; renderStep(); return; }
  doneCh.add(c.id); store.set(KEY + '-done', JSON.stringify([...doneCh]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) goChapter(ci - 1, CHAPTERS[ci - 1].steps.length - 1); }

function renderFinish() {
  fin.hidden = false;
  const F = FINALE || { title: 'On your own devices', lead: '', groups: [] };
  let ticks = readList(KEY + '-real'), n = 0;
  const deal = CHAPTERS.filter(c => c.needs || c.gives);
  fin.innerHTML = `<h2>${esc(F.heading || F.title)}</h2>${F.lead ? `<p class="lead">${F.lead}</p>` : ''}
    ${F.groups.map(g => `<section class="fgroup"><h3>${esc(g.title)}</h3>${g.note ? `<p class="fnote">${g.note}</p>` : ''}
      ${g.items.map(t => { const id = n++; return `<label><input type="checkbox" id="real-${id}" data-i="${id}" ${ticks.includes(id) ? 'checked' : ''}><span>${t}</span></label>`; }).join('')}</section>`).join('')}
    ${deal.length ? `<section class="fgroup"><h3>The whole deal on one page</h3><div class="dealwrap"><table class="dealtable"><thead><tr><th>Part</th><th>What it needs from you</th><th>What you get</th></tr></thead><tbody>
      ${deal.map(c => `<tr><th>${icon(c.icon)}<span>${esc(c.title)}</span></th><td>${c.needs || ''}</td><td>${c.gives || ''}</td></tr>`).join('')}</tbody></table></div></section>` : ''}
    <div class="fbtns"><button class="btn main-b" id="restart">Start the course again</button></div>`;
  fin.querySelectorAll('input').forEach(c => c.onchange = () => { const i = +c.dataset.i; ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set(KEY + '-real', JSON.stringify(ticks)); });
  document.getElementById('restart').onclick = () => goChapter(0);
}

/* Fit the pretend device into its box: the iPhone's stage is 360 × 660 and sits beside the coach, the iPad's is 1040 × 660 under it. */
function fit() {
  const box = document.getElementById('stagebox'), pad = S && S.device === 'pad', w = pad ? 1040 : 360;
  document.querySelector('.main').classList.toggle('dev-phone', !pad && ci < CHAPTERS.length);
  box.style.aspectRatio = w + ' / 660'; stage.style.width = w + 'px';
  stage.style.transform = `scale(${box.clientWidth / w})`;
}
stage.addEventListener('error', e => { if (e.target.classList && e.target.classList.contains('k-shot')) e.target.closest('.k-shotwrap').classList.add('k-noshot'); }, true);
new ResizeObserver(fit).observe(document.getElementById('stagebox'));

/* The test robot: walks every step in the real page and lists what does not work. Run  await __robot()  in the console. */
window.__robot = async (from = 0, to = CHAPTERS.length) => {
  const out = []; robotMode = true;
  for (let c = from; c < to; c++) for (let s = 0; s < CHAPTERS[c].steps.length; s++) {
    ci = c; si = s; renderStep();
    const st = step(), tag = `${CHAPTERS[c].id} ${s + 1}`;
    const need = n => { const el = stage.querySelector(`[data-t="${CSS.escape(n)}"]`); if (!el) out.push(`${tag}: nothing carries the ring "${n}"`); return el; };
    const t = typeof st.target === 'function' ? st.target(S) : st.target; [].concat(t || []).forEach(need);
    const wide = e => e && e.scrollWidth > e.clientWidth + 2;
    const look = () => { if (wide(stage.querySelector('.pane'))) out.push(`${tag}: the page is too wide`); if (wide(stage.querySelector('.k-sheet'))) out.push(`${tag}: the sheet is too wide`);
      const sh = stage.querySelector('.k-sheet'); if (sh && sh.offsetHeight > 640) out.push(`${tag}: the sheet is too tall`);
      const im = stage.querySelector('.k-shot'); if (st.shot && (!im || stage.querySelector('.k-noshot'))) out.push(`${tag}: the picture ${st.shot} is missing`); };
    look();
    if (st.kind === 'try') {
      for (const [op, a, b, d] of st.robot || []) {
        if (op === 'act') { const el = [...stage.querySelectorAll(`[data-act="${CSS.escape(a)}"]`)].find(x => b === undefined || x.dataset.arg === String(b));
          if (!el || el.disabled) { out.push(`${tag}: cannot press ${a} ${b ?? ''}`); break; } el.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
        else if (op === 'in') { const el = stage.querySelector(`[data-in="${CSS.escape(a)}"]`); if (!el) { out.push(`${tag}: no field ${a}`); break; }
          el.value = b; el.dispatchEvent(new Event(el.tagName === 'SELECT' ? 'change' : 'input', { bubbles: true })); }
        else if (op === 'drag') { dragMove(a, b, d); paint(); checkSolved(); }
        else if (op === 'key') { document.dispatchEvent(new KeyboardEvent('keydown', { key: a, bubbles: true })); }
        look();
      }
      if (!solved) out.push(`${tag}: the robot's steps do not finish it`);
    }
    if (st.kind === 'check') { const b = coach.querySelectorAll('.ans')[st.right]; if (b) b.click(); if (!solved) out.push(`${tag}: the right answer does not unlock Next`); }
    await new Promise(r => setTimeout(r, 0));
  }
  robotMode = false; return out;
};

const at = (() => { try { return JSON.parse(store.get(KEY + '-at') || '[0,0]'); } catch { return [0, 0]; } })();
if (at[0] < CHAPTERS.length && CHAPTERS[at[0]] && at[1] < CHAPTERS[at[0]].steps.length) goChapter(at[0], at[1]); else goChapter(0);
fit();

</script>
