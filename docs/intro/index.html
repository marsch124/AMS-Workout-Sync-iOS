<meta charset="utf-8">
<title>Triathlon Training Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: chapter rail on the left; on the right the coach card and a pretend iPhone beside it (or, for the Plan page, a pretend
   iPad under it). Same course format as the other AMS tours. Inside the pretend device the app's own look: a pale page, white cards,
   each part's colour on its headings and marks (Today green, Sessions and Plan blue, Body raspberry, Progress purple, Settings
   slate), the green main button, the green tick circle = done. */
:root {
  --bg: #F1F5F4; --panel: #FFFFFF; --fg: #16302F; --muted: #5C7373; --line: #DCE6E6;
  --accent: #00754E; --accent-soft: #DDEFE6; --main: #00875A; --on-main: #FFFFFF; --good: #00754E; --good-soft: #DDEFE6; --warn: #A9540F;
  --ring: #E6B53F; --shadow: 0 18px 40px rgba(10, 50, 45, .16);
  --win: #F6F8F8; --win-side: #E9EFEF; --win-sel: #DCE6E6; --win-fg: #16302F; --win-muted: #5C7373; --win-line: #DCE6E6; --card: #FFFFFF; --card-2: #EEF3F3;
  --desk-a: #CFE3DC; --desk-b: #E6EDF5; --phone-edge: #1C1C1E;
  --s-ok: #00875A; --s-ok-text: #00754E; --s-needs: #E8862E; --s-needs-text: #A9540F; --s-needs-soft: #FCEEDD; --s-fail: #C81E1E; --s-fail-text: #C81E1E;
  --i-today: #00875A; --i-plan: #1266C8; --i-sessions: #1266C8; --i-body: #C21E6E; --i-progress: #7C3AED; --i-settings: #5A6B7B; --i-season: #B45309;
  --body-tile: #F7DFEA; --body-ground: #FBF1F6; --today-col: #DDEFE6; --tomorrow: #E8F1FB; --extra: #DE9B26; --race: #EF4444;
  --sp-swim: #4F87F8; --sp-bike: #FFD60A; --sp-run: #85CE6C; --sp-strength: #FF8C1A; --sp-rowing: #0D9488; --sp-mobility: #8650FE; --sp-race: #EF4444; --sp-rest: #64748B; --sp-other: #22D3EE;
  --ink-swim: #2B4A88; --ink-bike: #8C7506; --ink-run: #49713B; --ink-strength: #8C4D0E; --ink-rowing: #075149; --ink-mobility: #4A2C8C; --ink-race: #832525; --ink-rest: #374050; --ink-other: #137486;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", sans-serif;
  --f-mac: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #071717; --panel: #102626; --fg: #F2F7F6; --muted: #A0B8B8; --line: #2A4A4A;
  --accent: #33D69A; --accent-soft: #0F3A30; --main: #00875A; --on-main: #FFFFFF; --good: #33D69A; --good-soft: #0F3A30; --warn: #F0A868;
  --ring: #F0C24A; --shadow: 0 18px 40px rgba(0, 0, 0, .5);
  --win: #0A1F1F; --win-side: #0F2828; --win-sel: #21403F; --win-fg: #FFFFFF; --win-muted: #A0B8B8; --win-line: #2A5555; --card: #1A3535; --card-2: #21403F;
  --desk-a: #0C2420; --desk-b: #14202C; --phone-edge: #4A4A50;
  --s-ok: #00C97B; --s-ok-text: #33D69A; --s-needs: #F0943F; --s-needs-text: #F5AE66; --s-needs-soft: #3A2A18; --s-fail: #FF6B6B; --s-fail-text: #FF8782;
  --i-today: #00C97B; --i-plan: #3B9EFF; --i-sessions: #3B9EFF; --i-body: #F472B6; --i-progress: #C084FC; --i-settings: #94A3B8; --i-season: #F59E0B;
  --body-tile: #3A1C2E; --body-ground: #1A0F16; --today-col: #0F3A30; --tomorrow: #122B3D; --extra: #F0B855; --race: #EF4444;
  --sp-swim: #4F87F8; --sp-bike: #FFD60A; --sp-run: #85CE6C; --sp-strength: #FF8C1A; --sp-rowing: #0D9488; --sp-mobility: #8650FE; --sp-race: #EF4444; --sp-rest: #64748B; --sp-other: #22D3EE;
  --ink-swim: #4F87F8; --ink-bike: #FFD60A; --ink-run: #85CE6C; --ink-strength: #FF8C1A; --ink-rowing: #2CC4B6; --ink-mobility: #A47CFE; --ink-race: #FF6B6B; --ink-rest: #A3B1C2; --ink-other: #22D3EE;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #071717; --panel: #102626; --fg: #F2F7F6; --muted: #A0B8B8; --line: #2A4A4A;
  --accent: #33D69A; --accent-soft: #0F3A30; --main: #00875A; --on-main: #FFFFFF; --good: #33D69A; --good-soft: #0F3A30; --warn: #F0A868;
  --ring: #F0C24A; --shadow: 0 18px 40px rgba(0, 0, 0, .5);
  --win: #0A1F1F; --win-side: #0F2828; --win-sel: #21403F; --win-fg: #FFFFFF; --win-muted: #A0B8B8; --win-line: #2A5555; --card: #1A3535; --card-2: #21403F;
  --desk-a: #0C2420; --desk-b: #14202C; --phone-edge: #4A4A50;
  --s-ok: #00C97B; --s-ok-text: #33D69A; --s-needs: #F0943F; --s-needs-text: #F5AE66; --s-needs-soft: #3A2A18; --s-fail: #FF6B6B; --s-fail-text: #FF8782;
  --i-today: #00C97B; --i-plan: #3B9EFF; --i-sessions: #3B9EFF; --i-body: #F472B6; --i-progress: #C084FC; --i-settings: #94A3B8; --i-season: #F59E0B;
  --body-tile: #3A1C2E; --body-ground: #1A0F16; --today-col: #0F3A30; --tomorrow: #122B3D; --extra: #F0B855; --race: #EF4444;
  --sp-swim: #4F87F8; --sp-bike: #FFD60A; --sp-run: #85CE6C; --sp-strength: #FF8C1A; --sp-rowing: #0D9488; --sp-mobility: #8650FE; --sp-race: #EF4444; --sp-rest: #64748B; --sp-other: #22D3EE;
  --ink-swim: #4F87F8; --ink-bike: #FFD60A; --ink-run: #85CE6C; --ink-strength: #FF8C1A; --ink-rowing: #2CC4B6; --ink-mobility: #A47CFE; --ink-race: #FF6B6B; --ink-rest: #A3B1C2; --ink-other: #22D3EE;
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45 }
.wrap { max-width: 1360px; margin: 0 auto; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
button { font: inherit; color: inherit }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Rail */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); align-self: start; display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 28px); overflow: auto }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px }
.apptile { width: 40px; height: 40px; border-radius: 10px; background: var(--main); color: #fff; display: grid; place-items: center; flex: none }
.apptile svg { width: 26px; height: 26px; stroke-width: 2.1 }
.brand h1 { font-family: var(--f-display); font-size: 18px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.chaps { display: flex; flex-direction: column; gap: 1px }
.chap { display: flex; align-items: center; gap: 9px; padding: 5px 9px; border-radius: 8px; border: 0; background: none; color: var(--fg); font-size: 14px; text-align: left; cursor: pointer }
.chap:hover { background: var(--accent-soft) }
.chap > span:first-of-type { min-width: 0 }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; display: flex }
.chap .n svg { width: 15px; height: 15px; stroke-width: 2.4 }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px; flex: none }
.bar i { display: block; height: 100%; background: var(--main); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: start; min-height: 150px }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach .eyebrow .only { color: var(--muted); font-weight: 500; border: 1px solid var(--line); border-radius: 20px; padding: 0 8px; letter-spacing: .02em; text-transform: none }
.coach h2 { font-family: var(--f-display); font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; max-width: 68ch }
.coach p b, .finish b { font-weight: 600 }
.coach .hint { color: var(--muted); font-size: 13.5px }
.coach .real { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: flex-start }
.coach .real svg { width: 15px; height: 15px; margin-top: 2px }
.deal { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-top: 8px; max-width: 76ch }
.deal > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font-size: 13.5px; display: flex; flex-direction: column; gap: 2px }
.deal b { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent) }
.coach .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end }
.btn { font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: var(--main); border-color: var(--main); color: var(--on-main) }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted); font-weight: 500; padding-inline: 8px }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.45em; margin: 0; display: flex; gap: 6px; align-items: center }
.feedback.no { color: var(--warn) }

/* Stage — its size is set by ui.js: 360 × 660 for the iPhone, 1040 × 660 for the iPad */
.stagebox { position: relative; width: 100%; aspect-ratio: 360 / 660; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); max-width: 100%; background: var(--win) }
.stage { position: absolute; left: 0; top: 0; width: 360px; height: 660px; transform-origin: 0 0; font: 12.5px/1.35 var(--f-mac); color: var(--win-fg); background: var(--win) }
.main.dev-phone { display: grid; grid-template-columns: minmax(0, 1fr) min(380px, 44%); gap: 16px; align-items: start }
.main.dev-phone .coach { grid-template-columns: minmax(0, 1fr); min-height: 0 }
.main.dev-phone .coach .btns { justify-content: flex-start; margin-top: 6px }
.main.dev-phone .stagebox { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px) }
.target { animation: ring 1.6s ease-in-out infinite; border-radius: 7px; position: relative; z-index: 2 }
@keyframes ring { 0%, 100% { box-shadow: 0 0 0 2px var(--ring), 0 0 0 6px rgba(230, 181, 63, .35) } 50% { box-shadow: 0 0 0 2px var(--ring), 0 0 0 11px rgba(230, 181, 63, 0) } }

/* Finish */
.finish { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px }
.finish h2 { font-family: var(--f-display); margin: 0; font-size: 24px; text-wrap: balance }
.finish .lead { margin: 0; max-width: 70ch }
.fgroup h3 { font-family: var(--f-display); margin: 0 0 4px; font-size: 17px }
.fnote { margin: 0 0 4px; color: var(--muted); font-size: 13.5px; max-width: 72ch }
.fgroup label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; max-width: 80ch }
.fgroup input { width: 18px; height: 18px; accent-color: var(--main); margin-top: 2px; flex: none }
.dealwrap { overflow-x: auto }
.dealtable { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 640px }
.dealtable th, .dealtable td { text-align: left; vertical-align: top; padding: 7px 10px 7px 0; border-top: 1px solid var(--line) }
.dealtable thead th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-top: 0 }
.dealtable tbody th { font-weight: 600; white-space: nowrap }
.dealtable tbody th svg { vertical-align: -4px; margin-right: 6px; color: var(--accent) }
.fbtns { display: flex; gap: 8px }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr) }
  .rail { position: static; max-height: none }
  .chaps { flex-direction: row; flex-wrap: wrap; gap: 3px }
  .chap .n { display: none }
  .coach { grid-template-columns: minmax(0, 1fr) }
  .coach .btns { justify-content: flex-start }
  .main.dev-phone { grid-template-columns: minmax(0, 1fr) }
  .main.dev-phone .stagebox { position: relative; top: 0; max-width: 420px; margin-inline: auto }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
/* kit.css — the pretend iPhone and iPad and the shared building blocks (all start with k-). Chapters add their own classes
   with their own prefix. Sizes are in the device's own points (the whole device is scaled to fit the page). */
.pane { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 9px }
.pane > *, .k-sheet > * { flex: none }
.k-dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .3); display: grid; place-items: center; z-index: 20 }
[data-part="today"] { --pc: var(--i-today); --pt: var(--i-today) } [data-part="plan"] { --pc: var(--i-plan); --pt: var(--i-plan) }
[data-part="sessions"] { --pc: var(--i-sessions); --pt: var(--i-sessions) } [data-part="body"] { --pc: var(--i-body); --pt: var(--i-body) }
[data-part="progress"] { --pc: var(--i-progress); --pt: var(--i-progress) } [data-part="settings"] { --pc: var(--i-settings); --pt: var(--i-settings) }

/* iPhone: 304 × 642 on a desk, its page 290 wide (the real one is 390 points: everything here is about three quarters of real size) */
.desk { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(160deg, var(--desk-a), var(--desk-b)) }
.phone { position: relative; width: 304px; height: 642px; border-radius: 38px; background: var(--win); border: 7px solid var(--phone-edge); overflow: hidden; display: flex; flex-direction: column }
.phone-body { position: relative; min-width: 0; overflow: hidden; flex: 1 }
.phone .pane { padding: 30px 12px 12px }
.phone-tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--win-line); background: var(--card) }
.phone-tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; font-size: 8.5px; font-weight: 600; color: var(--win-muted); cursor: pointer; padding: 6px 0 14px; --pc: var(--i-today) }
.phone-tabs button[data-part="sessions"] { --pc: var(--i-sessions) } .phone-tabs button[data-part="body"] { --pc: var(--i-body) }
.phone-tabs button[data-part="progress"] { --pc: var(--i-progress) } .phone-tabs button[data-part="settings"] { --pc: var(--i-settings) }
.phone-tabs button svg { width: 19px; height: 19px; color: var(--pc) }
.phone-tabs button.k-on { color: var(--pc); background: color-mix(in srgb, var(--pc) 16%, transparent) }
.phone .k-dim { place-items: end center }
.phone .k-sheet, .phone .k-sheet.k-wide { width: 100%; max-height: 560px; border-radius: 18px 18px 0 0; padding: 14px 12px 18px }

/* iPad (and the Mac window): a side list and the page, 1040 × 660 */
.pad { position: absolute; inset: 0; display: grid; grid-template-columns: 172px minmax(0, 1fr); background: var(--win) }
.pad-side { background: var(--win-side); border-right: 1px solid var(--win-line); padding: 14px 8px 10px; display: flex; flex-direction: column; gap: 2px }
.pad-app { font-size: 11px; font-weight: 600; color: var(--win-muted); padding: 2px 8px 8px }
.pad-part { display: flex; align-items: center; padding: 6px 9px; border: 0; background: none; border-radius: 7px; text-align: left; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--i-today) }
.pad-part[data-part="plan"], .pad-part[data-part="sessions"] { color: var(--i-plan) } .pad-part[data-part="body"] { color: var(--i-body) }
.pad-part[data-part="progress"] { color: var(--i-progress) } .pad-part[data-part="settings"] { color: var(--i-settings) }
.pad-part.k-on { background: var(--win-sel) }
.pad-foot { margin-top: auto; font-size: 11px; color: var(--win-muted); padding: 4px 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start }
.pad-body { position: relative; min-width: 0; overflow: hidden }
.pad .k-dim { place-items: center }

/* A real picture in place of the practice screen */
.phone-shot { background: #000 }
.k-shotwrap { position: absolute; inset: 0; display: grid; place-items: center }
.k-shot { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; user-select: none }
.k-shotnote { display: none; color: var(--win-muted); padding: 20px; text-align: center }
.k-noshot .k-shot { display: none } .k-noshot .k-shotnote { display: block }
.k-realtag { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: rgba(20, 30, 30, .82); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 20px; white-space: nowrap; z-index: 5; pointer-events: none }
.k-realtag svg { width: 13px; height: 13px }
.desk-pad { place-items: start center; overflow-y: auto; padding: 12px 0 }
.padshot { position: relative; width: 760px; border-radius: 16px; border: 6px solid var(--phone-edge); overflow: hidden; background: #000 }
.padshot .k-shotwrap { position: static; display: block }
.padshot .k-shot { height: auto; object-fit: contain }
.desk-pad .k-realtag { position: sticky; bottom: 4px; left: auto; transform: none; margin: -30px auto 0; width: max-content }

/* Words and figures */
.k-h1 { font-size: 22px; font-weight: 700; line-height: 1.15; margin: 0; color: var(--pt) }
.phone .k-h1 { font-size: 20px }
.k-h2 { font-size: 15px; font-weight: 650; margin: 0 }
.k-sub, .k-muted { color: var(--win-muted) }
.k-small { font-size: 11.5px }
.k-cap { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--win-muted) }
.k-big { font-size: 30px; font-weight: 700; line-height: 1.1; color: var(--pt); font-variant-numeric: tabular-nums }
.k-fig { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap }
.k-pt { color: var(--pt) }
.k-oktext { color: var(--s-ok-text) } .k-needstext { color: var(--s-needs-text) } .k-failtext { color: var(--s-fail-text) }

/* Layout */
.k-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.k-sp { flex: 1 }
.k-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.k-col { display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.k-cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 10px; align-items: start }
.k-cols.k-even { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.k-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.k-grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px }
.k-card { background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.k-card.k-plain { background: none; border: 1px solid var(--win-line) }
.k-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--win-line); min-width: 0 }
.k-row:first-child, .k-cap + .k-row, .k-norule { border-top: 0 }
.k-row.k-sel { background: var(--win-sel); border-radius: 6px; padding-inline: 6px; border-top-color: transparent }
.k-row[data-act] { cursor: pointer }
.k-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

/* Buttons and choices */
.k-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--win-line); background: var(--card); border-radius: 9px; padding: 6px 12px; font: inherit; color: inherit; cursor: pointer; white-space: nowrap }
.k-btn svg, .k-link svg { width: 15px; height: 15px }
.k-btn.k-main { background: var(--main); border-color: var(--main); color: #fff; font-weight: 600 }
.k-btn.k-full { width: 100% }
.k-btn.k-out { border-color: var(--pt); color: var(--pt); background: none; font-weight: 600 }
.k-btn.k-quiet { border-color: transparent; background: none; color: var(--win-muted) }
.k-btn.k-danger { color: var(--s-fail-text) }
.k-btn:disabled { opacity: .45; cursor: default }
.k-link { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer }
.k-seg { display: inline-flex; background: var(--card-2); border-radius: 8px; padding: 2px; gap: 2px }
.k-seg button { border: 0; background: none; border-radius: 6px; padding: 3px 12px; cursor: pointer }
.k-seg button.k-on { background: var(--win); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .18) }
.k-stepper { display: inline-flex; align-items: center; gap: 6px }
.k-stepper b { min-width: 128px; text-align: center; font-size: 14px }
.k-stepper button { display: grid; place-items: center; width: 28px; height: 26px; border: 1px solid var(--win-line); background: var(--win); border-radius: 7px; cursor: pointer }
.k-stepper svg { width: 15px; height: 15px }
.k-pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--win-line); background: var(--win); border-radius: 20px; padding: 3px 11px; cursor: pointer }
.k-pill.k-on { border-color: var(--main); background: var(--main); color: #fff; font-weight: 600 }
.k-pill.k-grey { background: var(--card-2); border-color: transparent; color: var(--win-muted); font-size: 11px }
.k-tile { display: flex; align-items: center; gap: 6px; min-height: 26px; border: 1px solid var(--win-line); background: var(--win); border-radius: 7px; padding: 3px 9px; cursor: pointer; text-align: left }
.k-tile.k-on { border-color: var(--main); box-shadow: inset 0 0 0 1px var(--main); font-weight: 600 }
.k-tick { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 0; cursor: pointer; text-align: left }
.k-box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--win-muted); display: grid; place-items: center; flex: none }
.k-tick.k-on .k-box { background: var(--main); border-color: var(--main); color: #fff }
.k-box svg { width: 12px; height: 12px; stroke-width: 3 }
.k-in { font: inherit; color: inherit; background: var(--win); border: 1px solid var(--win-line); border-radius: 6px; padding: 4px 8px; min-width: 0 }
.k-kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border: 1px solid var(--win-line); border-bottom-width: 2px; border-radius: 4px; font-size: 11px; color: var(--win-muted); background: var(--win) }
.k-field { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px; align-items: center }
.phone .k-field { grid-template-columns: 92px minmax(0, 1fr) }
.k-field > label, .k-field > span:first-child { color: var(--win-muted) }

/* Bars, marks, bands */
.k-bar { position: relative; display: inline-block; flex: 1; min-width: 60px; height: 8px; border-radius: 4px; background: var(--s-fail); box-shadow: inset 0 0 0 1px var(--win-line); overflow: hidden }
.k-bar:not(.k-over) { background: var(--card-2) }
.k-bar i { position: absolute; inset: 0 auto 0 0; background: var(--pt, var(--main)); border-radius: 4px 0 0 4px }
.k-bar u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--win-fg); text-decoration: none }
.k-mark { display: inline-flex; align-items: center; gap: 6px }
.k-mark i { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--win-muted) }
.k-mark.k-ok i { background: var(--s-ok) } .k-mark.k-needs i { background: var(--s-needs) } .k-mark.k-fail i { background: var(--s-fail) }
.k-mark.k-ring i { background: none; border: 2px solid var(--win-muted) }
.k-band { display: flex; align-items: flex-start; gap: 8px; border-radius: 8px; padding: 7px 10px; background: var(--card) }
.k-band svg { width: 16px; height: 16px; margin-top: 1px }
.k-band.k-needs { background: var(--s-needs-soft); color: var(--s-needs-text) }
.k-band.k-ok { color: var(--s-ok-text) } .k-band.k-fail { color: var(--s-fail-text) }
.k-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
.k-table th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--win-muted); padding: 3px 10px 3px 0 }
.k-table td { padding: 5px 10px 5px 0; border-top: 1px solid var(--win-line); vertical-align: top }
.k-table tr.k-sel td { background: var(--win-sel) }
.k-table tr[data-act] { cursor: pointer }

/* Sheets, drag rows, toast */
.k-sheet { width: 520px; max-height: 610px; color: var(--win-fg); overflow-x: hidden; overflow-y: auto; background: var(--win); border-radius: 12px; padding: 16px 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, .35); display: flex; flex-direction: column; gap: 10px }
.k-sheet.k-wide { width: 780px }
.k-sheet h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--pt) }
.k-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px }
.k-dragrow { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-top: 1px solid var(--win-line); border-radius: 6px; background: var(--win) }
.k-grip { display: grid; place-items: center; width: 24px; height: 22px; color: var(--win-muted); cursor: grab; touch-action: none; border: 0; background: none; border-radius: 5px }
.k-grip svg { width: 15px; height: 15px }
.k-dragging { opacity: .5 }
.k-dropat { box-shadow: inset 0 2px 0 var(--main) }
.k-toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--win-fg); color: var(--win); font-weight: 600; padding: 7px 14px; border-radius: 20px; z-index: 50; max-width: 80%; text-align: center }

/* This app's own blocks */
.k-sport { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; flex: none; background: color-mix(in srgb, var(--sc) 22%, transparent); color: var(--si) }
.k-sport svg { width: 58%; height: 58% }
.k-sp-swim { --sc: var(--sp-swim); --si: var(--ink-swim) } .k-sp-bike, .k-sp-brick { --sc: var(--sp-bike); --si: var(--ink-bike) } .k-sp-run { --sc: var(--sp-run); --si: var(--ink-run) }
.k-sp-strength { --sc: var(--sp-strength); --si: var(--ink-strength) } .k-sp-rowing { --sc: var(--sp-rowing); --si: var(--ink-rowing) } .k-sp-mobility { --sc: var(--sp-mobility); --si: var(--ink-mobility) }
.k-sp-race { --sc: var(--sp-race); --si: var(--ink-race) } .k-sp-rest { --sc: var(--sp-rest); --si: var(--ink-rest) } .k-sp-other { --sc: var(--sp-other); --si: var(--ink-other) }
.k-sportword { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--si) }
.k-done { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--s-ok); color: #fff; flex: none }
.k-done svg { width: 12px; height: 12px; stroke-width: 3 }
.k-back { display: inline-flex; align-items: center; gap: 3px; border: 0; background: none; padding: 2px 0; color: var(--pt); font-weight: 600; cursor: pointer; align-self: flex-start }
.k-back svg { width: 16px; height: 16px; stroke-width: 2.1 }
.k-hero { background: var(--pc); color: #fff; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.k-herocap { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; opacity: .85 }
.k-herotitle { font-size: 22px; font-weight: 700; line-height: 1.15 }
.k-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px }
.k-stats.k-three { grid-template-columns: repeat(3, minmax(0, 1fr)) }
.k-stat { display: flex; flex-direction: column; gap: 1px; background: var(--card); border: 0; border-radius: 10px; padding: 9px 11px; text-align: left; min-width: 0; font: inherit; color: inherit }
button.k-stat { cursor: pointer }
.k-stat b { font-size: 17px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums }
.k-stat span { font-size: 10.5px; color: var(--win-muted) }
.k-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--card-2); border: 0; border-radius: 20px; padding: 2px 9px; font: inherit; font-size: 11px; font-weight: 600; color: var(--win-fg); white-space: nowrap }
button.k-chip { cursor: pointer }
.k-switch { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 5px 0; cursor: pointer; text-align: left; font: inherit; color: inherit }
.k-switch > span { flex: 1; min-width: 0 }
.k-switch > i { width: 34px; height: 20px; border-radius: 10px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--win-line); position: relative; flex: none; transition: background .15s }
.k-switch > i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: left .15s }
.k-switch.k-on > i { background: var(--main) } .k-switch.k-on > i::after { left: 16px }
.k-nav { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: var(--card); border-radius: 10px; padding: 8px 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; min-width: 0 }
.k-navw { display: flex; flex-direction: column; flex: 1; min-width: 0 }
.k-navw small { font-size: 10.5px; color: var(--win-muted) }
.k-nav > svg.i { width: 14px; height: 14px; color: var(--win-muted) }
.k-list { display: flex; flex-direction: column; gap: 5px }

/* ===== 00-wel.css ===== */
/* Every class a chapter invents starts with its id. */
.wel-ses { border: 0; text-align: left; cursor: pointer; font: inherit; color: inherit }
.wel-words { gap: 2px; flex: 1 }
.wel-title { font-size: 17px; line-height: 1.2 }

/* ===== 01-tod.css ===== */
/* Every class a chapter invents starts with its id. */
.tod-face { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; min-width: 0; padding: 6px 0 4px; border: 1.5px solid var(--win-line); border-radius: 11px; background: var(--card); color: var(--win-fg); font: inherit; font-size: 10.5px; font-weight: 600; cursor: pointer }
.tod-face svg { width: 22px; height: 22px; stroke-width: 1.6 }
.tod-face span { color: var(--win-muted) }
.tod-face.tod-on { border-color: var(--i-today); background: color-mix(in srgb, var(--i-today) 14%, var(--card)) }
.tod-faces { display: flex; gap: 5px }
.tod-line { font-size: 11.5px; color: var(--win-muted); padding: 0 2px; margin-top: -4px; border: 0; background: none; text-align: left; font-family: inherit }
.tod-line b { color: var(--win-fg) }
button.tod-line { cursor: pointer }
.tod-card { border: 0; text-align: left; font: inherit; color: inherit; width: 100% }
button.tod-card { cursor: pointer }
.tod-words { gap: 2px; flex: 1; min-width: 0 }
.tod-title { font-size: 14px; line-height: 1.2 }
.tod-weekhead { display: flex; align-items: center; gap: 8px }
.tod-key { border: 0; background: color-mix(in srgb, var(--i-today) 18%, transparent); color: var(--i-today); border-radius: 10px; font: inherit; font-size: 10px; font-weight: 700; padding: 1px 8px; cursor: pointer }
.tod-cols { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; align-items: end; height: 74px; margin-top: 4px }
.tod-col { display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; justify-content: flex-start }
.tod-b { position: relative; border-radius: 3px; background: var(--c) }
.tod-b.tod-todo { background: color-mix(in srgb, var(--c) 28%, transparent) }
.tod-b.tod-dot { background: color-mix(in srgb, var(--c) 22%, transparent); border: 1px dashed var(--c) }
.tod-b i { position: absolute; top: 1px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--s-ok); color: #fff; display: grid; place-items: center }
.tod-b i svg { width: 6px; height: 6px; stroke-width: 3.4 }
.tod-rest { height: 3px; border-radius: 2px; background: var(--sp-rest); width: 60%; margin: 0 auto }
.tod-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; font-size: 10px; color: var(--win-muted); margin-top: 3px }
.tod-days b { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: color-mix(in srgb, var(--i-today) 18%, transparent); color: var(--i-today) }
.tod-swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; background: var(--c); flex: none }
.tod-swatch.tod-todo { background: color-mix(in srgb, var(--c) 28%, transparent) }
.tod-swatch.tod-dot { background: color-mix(in srgb, var(--c) 22%, transparent); border: 1px dashed var(--c) }
.tod-keyrow { display: flex; flex-wrap: wrap; gap: 5px 12px; font-size: 10.5px; color: var(--win-muted); padding-top: 4px; border-top: 1px solid var(--win-line) }
.tod-keyrow span { display: inline-flex; align-items: center; gap: 5px }
.tod-sbar { display: block; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--c) 28%, transparent); overflow: hidden }
.tod-sbar i { display: block; height: 100%; background: var(--c); border-radius: 3px }
.tod-srow { display: flex; flex-direction: column; gap: 2px }
.tod-srow .k-line { gap: 5px; flex-wrap: nowrap }
.tod-srow svg { width: 13px; height: 13px; color: var(--ink) }
.tod-head { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--i-today) }
.tod-grey { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--win-muted); padding-top: 4px }
.tod-sun { border-radius: 12px; overflow: hidden; background: var(--card) }
.tod-sunhead { background: var(--i-plan); color: #fff; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px }
.tod-sunhead .k-line { justify-content: space-between; flex-wrap: nowrap }
.tod-sunhead button { border: 0; background: rgba(255, 255, 255, .22); color: #fff; border-radius: 10px; font: inherit; font-size: 10px; font-weight: 600; padding: 1px 8px; cursor: pointer }
.tod-sunbig { font-size: 20px; font-weight: 700 }
.tod-sunrow { display: flex; align-items: center; gap: 7px; padding: 4px 10px }
.tod-sunrow .k-sport { width: 24px; height: 24px }
.tod-sunday { width: 26px; font-size: 10.5px; font-weight: 600; color: var(--i-plan) }
.tod-tomtab { align-self: flex-start; background: var(--s-needs-soft, var(--card)); font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--win-muted); padding: 5px 9px; border-radius: 10px 8px 0 0 }
.tod-tom { background: color-mix(in srgb, var(--i-plan) 10%, var(--win)); border-radius: 0 12px 12px 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px }
.tod-pill { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--i-today); color: var(--i-today); background: none; border-radius: 12px; font: inherit; font-size: 10.5px; font-weight: 600; padding: 2px 9px; cursor: pointer }
.tod-pill svg { width: 11px; height: 11px }
.tod-toprow { display: flex; align-items: center; justify-content: space-between; gap: 6px }
.tod-chipbtn { border: 0; background: color-mix(in srgb, var(--i-today) 18%, transparent); color: var(--i-today); border-radius: 12px; font: inherit; font-size: 10.5px; font-weight: 600; padding: 3px 9px; cursor: pointer; white-space: nowrap }
.tod-foot { display: flex; justify-content: center; padding-top: 2px }
.tod-g { display: flex; flex-direction: column; gap: 4px; cursor: pointer; border: 0; background: none; text-align: left; font: inherit; color: inherit; padding: 0 2px; margin-top: -4px }
.tod-gline { font-size: 11px; color: var(--win-muted) }
.tod-gline b { color: var(--win-fg) }
.tod-gdot { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--win-muted) }
.tod-gdot i { width: 7px; height: 7px; border-radius: 50%; background: var(--s-ok) }
.tod-plate .k-card { gap: 1px }
.tod-ex { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-rest, var(--win-muted)) }
.tod-card[data-act] { cursor: pointer }
.tod-noterow { display: flex; gap: 6px; justify-content: flex-end }
.tod-comment { border: 0; background: none; font: inherit; font-size: 11.5px; color: var(--win-muted); text-align: left; padding: 0 2px; margin-top: -4px; cursor: pointer }

/* ===== 02-sug.css ===== */
/* Every class a chapter invents starts with its id. Blue = the plan's own colour (it means "this changes the plan"). */
.sug-top { display: flex; align-items: center; justify-content: space-between; gap: 6px }
.sug-chip { border: 0; background: color-mix(in srgb, var(--i-today) 18%, transparent); color: var(--i-today); border-radius: 12px; font: inherit; font-size: 10.5px; font-weight: 600; padding: 3px 9px; white-space: nowrap }
.sug-grey { font-size: 11.5px; color: var(--win-muted); padding: 0 2px }
.sug-grey b { color: var(--win-fg) }
.sug-card { background: var(--card); border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 6px }
.sug-head { font-size: 14px; font-weight: 650; line-height: 1.25 }
.sug-why { font-size: 12px; color: var(--win-muted) }
.sug-btns { display: flex; gap: 6px; padding-top: 2px }
.sug-eq { flex: 1; min-height: 31px; border: 1.5px solid var(--i-plan); color: var(--i-plan); background: none; border-radius: 9px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer }
.sug-other { border: 0; background: none; color: var(--i-plan); font: inherit; font-size: 12px; font-weight: 650; padding: 0; text-align: left; cursor: pointer; align-self: flex-start }
.sug-orow { display: flex; align-items: center; gap: 8px; background: var(--card-2); border-radius: 9px; padding: 6px 9px; font-size: 12px }
.sug-orow span:first-child { flex: 1; min-width: 0 }
.sug-orow button { border: 0; background: none; color: var(--i-plan); font: inherit; font-size: 12px; font-weight: 650; cursor: pointer }
.sug-foot { font-size: 9.5px; color: var(--win-muted) }
.sug-changed { display: flex; align-items: center; gap: 6px }
.sug-undo { border: 0; background: color-mix(in srgb, var(--i-plan) 16%, transparent); color: var(--i-plan); border-radius: 12px; font: inherit; font-size: 11px; font-weight: 650; padding: 2px 10px; cursor: pointer }
.sug-ses { border: 0; text-align: left; font: inherit; color: inherit; width: 100% }
.sug-words { gap: 2px; flex: 1; min-width: 0 }
.sug-title { font-size: 14px; line-height: 1.2 }
.sug-pill { align-self: center; border: 1px solid var(--win-line); background: var(--card-2); color: var(--win-muted); border-radius: 12px; font: inherit; font-size: 10.5px; padding: 2px 11px; cursor: pointer }
.sug-pillrow { display: flex; justify-content: center; padding-top: 2px }
.sug-row { display: block; width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 11px; padding: 10px 11px; font: inherit; color: inherit; cursor: pointer }
.sug-row b { display: block; font-size: 14px }
.sug-row span { display: block; font-size: 11.5px; color: var(--win-muted); margin-top: 2px }
.sug-stopt { color: var(--s-fail-text); font-size: 15px; font-weight: 700 }
.sug-ok { border: 0; background: color-mix(in srgb, var(--i-today) 18%, transparent); color: var(--i-today); border-radius: 12px; font: inherit; font-size: 11px; font-weight: 650; padding: 3px 11px; cursor: pointer }
.sug-quiet { border: 0; background: none; color: var(--win-muted); font: inherit; font-size: 11px; font-weight: 650; padding: 0; text-align: left; cursor: pointer; align-self: flex-start }
.sug-stairs { display: flex; flex-direction: column; gap: 4px }
.sug-stair { border-radius: 9px; padding: 5px 8px; background: color-mix(in srgb, var(--i-today) 7%, transparent); opacity: .8; display: flex; gap: 6px; align-items: flex-start }
.sug-stair b { font-size: 11.5px; display: block }
.sug-stair span { font-size: 10.5px; color: var(--win-muted); display: block }
.sug-stair.sug-now { background: var(--i-today); opacity: 1 }
.sug-stair.sug-now b, .sug-stair.sug-now span { color: #fff }
.sug-rowhead { display: flex; align-items: baseline; gap: 8px }
.sug-kind { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--i-plan) }
.sug-chbtn { border: 0; background: color-mix(in srgb, var(--i-today) 18%, transparent); color: var(--i-today); border-radius: 12px; font: inherit; font-size: 11px; font-weight: 650; padding: 2px 10px; cursor: pointer }
.sug-boxed { background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px }
.sug-sel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }

/* ===== 03-log.css ===== */
/* Every class a chapter invents starts with its id. */
.log-words { gap: 2px; flex: 1; min-width: 0 }
.log-title { font-size: 17px; line-height: 1.2 }
.log-btns { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-width: 0 }
.log-three input { width: 100%; min-width: 0; box-sizing: border-box }
.log-three > div { min-width: 0 }
.log-effort { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px }
.log-effort button { border: 1.5px solid var(--pt); background: none; color: var(--pt); border-radius: 7px; min-height: 28px; font: inherit; font-weight: 700; cursor: pointer; padding: 0 }
.log-three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px }
.log-three label { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; color: var(--pt) }
.log-box { background: var(--card); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-sizing: border-box }
.log-sug { background: var(--card); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 4px }
.log-bad { color: var(--s-fail-text); font-size: 11.5px }
.log-pen { padding: 4px 8px }
.log-ex { border: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100% }
.log-box .k-btn { white-space: normal; text-align: center; max-width: 100% }
.log-three .k-in { width: 100%; box-sizing: border-box }

/* ===== 04-ses.css ===== */
/* Every class a chapter invents starts with its id. */
.ses-words { gap: 2px; flex: 1; min-width: 0 }
.ses-title { font-size: 17px; line-height: 1.2 }
.ses-top { display: flex; justify-content: space-between; align-items: center; gap: 6px }
.ses-wrap { display: flex; flex-wrap: wrap; gap: 5px; align-items: center }
.ses-pool { display: flex; flex-direction: column; gap: 6px; min-height: 480px }
.ses-pool .ses-big { font-size: 26px; font-weight: 800 }
.ses-row { padding: 8px 10px; border-radius: 12px; font-size: 16px; font-weight: 600; border: 0; text-align: left; background: none; color: inherit; font-family: inherit; cursor: pointer }
.ses-cur { background: var(--sp-swim); color: var(--on-main); font-weight: 800 }
.ses-zones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto }
.ses-zones button { min-height: 64px; border: 0; border-radius: 14px; font: inherit; font-size: 20px; font-weight: 800; cursor: pointer; background: var(--card-2); color: inherit }
.ses-zones .ses-next { background: var(--sp-swim); color: var(--on-main) }
.ses-route { height: 86px; border-radius: 12px; background: var(--card-2); display: flex; align-items: center; justify-content: center }
.ses-route svg { width: 90%; height: 80%; fill: none; stroke: var(--ink-run); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round }
.ses-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px }
.ses-tbl th { text-align: left; color: var(--win-muted); font-weight: 600 }
.ses-tbl td, .ses-tbl th { padding: 2px 4px }
.ses-pick { border: 0; cursor: pointer; font: inherit; color: inherit; background: var(--card); border-radius: 12px; padding: 7px 9px; text-align: left; display: flex; flex-direction: column }
.ses-last { display: flex; gap: 6px; align-items: baseline; font-size: 12px }
.ses-last span:first-child { width: 92px; color: var(--win-muted) }
.ses-bad { color: var(--s-fail-text); font-size: 11.5px }

/* ===== 05-lst.css ===== */
/* Chapter 5 — Sessions. Every class starts with lst-. */
.lst-search { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--pt); border-radius: 12px; padding: 4px 6px 4px 10px }
.lst-search .k-in { flex: 1; border: 0; background: none; padding: 4px 0 }
.lst-filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px }
.lst-filt { display: flex; flex-direction: column; align-items: center; gap: 0; border: 0; border-radius: 10px; background: var(--card); color: var(--win-muted); padding: 5px 0 4px; font: inherit; cursor: pointer }
.lst-filt span { font-size: 10px; font-weight: 600 }
.lst-filt b { font-size: 17px; font-variant-numeric: tabular-nums }
.lst-filt.k-on { color: var(--pt); background: color-mix(in srgb, var(--pt) 16%, transparent) }
.lst-bar { display: flex; gap: 1.5px; height: 9px; border-radius: 6px; overflow: hidden }
.lst-bar i { display: block; height: 100% }
.lst-bar .lst-b-done { background: var(--pt) }
.lst-bar .lst-b-missed { background: repeating-linear-gradient(135deg, var(--pt) 0 1.4px, transparent 1.4px 4px) }
.lst-bar .lst-b-todo { background: color-mix(in srgb, var(--pt) 34%, transparent) }
.lst-day { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--win-muted); margin-top: 4px }
.lst-card { flex-direction: row; align-items: flex-start; gap: 9px; border: 2px solid transparent }
.lst-card.lst-done { border-color: var(--s-ok) }
.lst-card.lst-miss { border-color: color-mix(in srgb, var(--s-fail) 70%, transparent) }
.lst-words { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0 }
.lst-title { font-size: 13.5px; line-height: 1.2 }
.lst-missed { color: var(--s-fail-text) }
.lst-found { font-size: 11px; color: var(--win-muted); padding: 2px 4px 0 }
.lst-empty { color: var(--win-muted); padding-top: 10px }
.lst-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center }
.lst-top h3 { text-align: center }
.lst-top .k-btn { justify-self: start }
.lst-favs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.lst-fav { display: flex; align-items: center; gap: 6px; flex: none; max-width: 170px; text-align: left; border: 1px solid var(--pt); background: var(--card); border-radius: 12px; padding: 5px 9px; cursor: pointer; font: inherit; color: inherit }
.lst-fav small { display: block; color: var(--win-muted); font-size: 10.5px }
.lst-sticky { position: sticky; bottom: -18px; background: var(--win); padding-top: 6px }
.lst-line-bad { color: var(--s-fail-text); font-size: 12px }
.lst-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px }
.lst-choices button { border: 0; border-radius: 20px; padding: 6px 0; font: inherit; font-weight: 600; color: var(--pt); background: color-mix(in srgb, var(--pt) 14%, transparent); cursor: pointer }
.lst-choices button.k-on { background: var(--pt); color: #fff }
.lst-paperbox { overflow: auto; max-height: 250px; background: var(--card-2); border-radius: 8px; padding: 6px }
/* The paper is paper: black on white whatever the look. */
.lst-paper { background: #fff; color: #000; padding: 8px; font-size: 7px; line-height: 1.25; box-shadow: 0 1px 4px rgba(0, 0, 0, .3) }
.lst-paper.lst-w { width: 560px } .lst-paper.lst-m { width: 330px }
.lst-p-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; font-weight: 700; margin-bottom: 4px }
.lst-p-head small { font-size: 7px; color: #666; font-weight: 600 }
.lst-p-week { display: grid; grid-template-columns: repeat(7, 1fr); border: .5px solid #888; min-height: 190px }
.lst-p-week > div { border-left: .5px solid #888; padding: 3px }
.lst-p-week > div:first-child { border-left: 0 }
.lst-p-week .lst-d { font-weight: 700; border-bottom: 1px solid #000; margin-bottom: 3px }
.lst-p-item { display: flex; gap: 3px; margin-bottom: 4px }
.lst-p-item i { width: 3px; flex: none; background: var(--c) }
.lst-p-item b { display: block; font-size: 6px; text-transform: uppercase }
.lst-p-item em { display: block; font-style: normal; color: #666; font-size: 6px }
.lst-p-month { display: grid; grid-template-columns: repeat(7, 1fr); border-top: .5px solid #888; border-left: .5px solid #888 }
.lst-p-month > div { border-right: .5px solid #888; border-bottom: .5px solid #888; min-height: 46px; padding: 2px; font-size: 6px; overflow: hidden }
.lst-p-month .lst-h { min-height: 0; font-weight: 700; text-align: center }
.lst-p-month .lst-out { color: #999 }
.lst-p-month .lst-p-item { margin-bottom: 1px } .lst-p-month .lst-p-item b { font-size: 5.5px }
.lst-p-tot { border-top: 1px solid #000; margin-top: 4px; padding-top: 2px; font-weight: 700; font-size: 7px }
.lst-p-tot span { font-weight: 400; color: #666; margin-left: 8px }
.lst-sw { --c: var(--sp-swim) } .lst-bi { --c: var(--sp-bike) } .lst-ru { --c: var(--sp-run) } .lst-st { --c: var(--sp-strength) } .lst-mo { --c: var(--sp-mobility) }
.lst-chg { display: flex; flex-direction: column; gap: 2px; border-radius: 12px; background: var(--card); padding: 8px 10px }
.lst-chg.lst-u { opacity: .7 }
.lst-kind { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--i-sessions) }
.lst-kind.lst-rem { color: var(--s-fail-text) }
.lst-undo { color: var(--s-ok-text); border-color: var(--s-ok) }
.lst-undo.lst-danger { color: var(--s-fail-text); border-color: var(--s-fail) }
.lst-grey { color: var(--win-muted); font-size: 11.5px }

/* ===== 06-pln.css ===== */
/* Chapter 6 — The Plan page (iPad and Mac). Every class starts with pln-. */
.pln-keys { display: block; border: 0; background: none; padding: 2px 0; font: inherit; font-weight: 600; color: var(--i-settings); cursor: pointer }
.pln-sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--win-muted) }
.pln-sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--s-ok) }
.pln-season { position: relative; display: flex; gap: 2px; align-items: flex-end; height: 74px; padding-top: 10px }
.pln-bar { position: relative; flex: 1; display: flex; align-items: flex-end; border: 0; background: none; padding: 0; cursor: pointer; height: 100% }
.pln-bar b { display: block; width: 100%; background: var(--sp-swim); border-radius: 2px }
.pln-bar.pln-on { outline: 2px solid var(--win-fg); outline-offset: 2px; border-radius: 4px }
.pln-bar u { position: absolute; top: -2px; bottom: 0; width: 1.5px; background: var(--s-ok); text-decoration: none }
.pln-bar u::before { content: "Today"; position: absolute; top: -9px; left: 3px; font-size: 9px; font-weight: 600; color: var(--s-ok-text) }
.pln-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.pln-steps { display: flex; gap: 6px; margin-left: auto }
.pln-step { border: 1px solid var(--s-ok); color: var(--s-ok-text); background: none; border-radius: 20px; padding: 3px 10px; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap }
.pln-title { display: flex; align-items: baseline; gap: 10px }
.pln-title b { font-size: 17px }
.pln-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.pln-col { display: flex; flex-direction: column; gap: 5px; min-height: 120px; padding: 6px; border-radius: 10px; background: var(--card-2) }
.pln-col.pln-today { background: color-mix(in srgb, var(--s-ok) 14%, var(--card-2)) }
.pln-col.k-dropat { box-shadow: inset 0 0 0 2px var(--i-plan) }
.pln-col > .pln-h { font-size: 11.5px; font-weight: 600; color: var(--win-muted) }
.pln-col.pln-today > .pln-h { font-weight: 800; color: var(--s-ok-text) }
.pln-dummy[hidden] { display: none }
.pln-card { position: relative; display: flex; flex-direction: column; gap: 1px; text-align: left; border: 0; border-radius: 8px; background: var(--card); color: inherit; font: inherit; padding: 5px 6px 5px 11px; cursor: pointer; box-shadow: inset 0 0 0 .5px var(--win-line) }
.pln-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 8px 0 0 8px; background: var(--c) }
.pln-card b { font-size: 12px; font-weight: 600 }
.pln-card .pln-len { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--win-muted) }
.pln-card .k-done { width: 15px; height: 15px }
.pln-card .k-done svg { width: 9px; height: 9px }
.pln-extra { display: flex; justify-content: space-between; align-items: flex-start; border-radius: 8px; padding: 5px 6px; border: 1.2px dashed var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); font-size: 12px; font-weight: 600 }
.pln-extra small { display: block; font-weight: 400; color: var(--win-muted); font-size: 10.5px }
.pln-add { border: 0; background: none; padding: 2px 0; color: var(--i-plan); font: inherit; font-size: 11px; font-weight: 600; text-align: left; margin-top: auto; cursor: pointer }
.pln-rule { height: 1px; background: var(--win-line) }
.pln-sw { --c: var(--sp-swim) } .pln-bi { --c: var(--sp-bike) } .pln-ru { --c: var(--sp-run) } .pln-st { --c: var(--sp-strength) } .pln-mo { --c: var(--sp-mobility) } .pln-re { --c: var(--sp-rest) } .pln-ot { --c: var(--sp-other) } .pln-wa { --c: var(--sp-mobility) }
.pln-moved { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 10px; padding: 6px 10px; font-weight: 600; font-size: 12px }
.pln-hint { color: var(--win-muted); font-size: 12px }
.pln-month { display: grid; grid-template-columns: 74px repeat(7, 1fr); gap: 4px }
.pln-mh { font-size: 11px; font-weight: 600; color: var(--win-muted); padding-left: 5px }
.pln-wk { font-size: 11px; line-height: 1.25; padding-top: 5px } .pln-wk b { display: block }
.pln-cell { min-height: 62px; border-radius: 8px; background: var(--card-2); padding: 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.pln-cell.pln-today { background: color-mix(in srgb, var(--s-ok) 14%, var(--card-2)) }
.pln-cell.pln-out { opacity: .45 }
.pln-cell > span { font-size: 11px; font-weight: 600; color: var(--win-muted) }
.pln-cell.pln-today > span { color: var(--s-ok-text); font-weight: 800 }
.pln-chip { position: relative; display: flex; flex-direction: column; border-radius: 6px; background: var(--card); padding: 2px 4px 2px 8px; font-size: 11px; font-weight: 600; box-shadow: inset 0 0 0 .5px var(--win-line) }
.pln-chip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); border-radius: 6px 0 0 6px }
.pln-chip small { font-size: 10px; font-weight: 400; color: var(--win-muted) }
.pln-year { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 220px)); gap: 10px }
.pln-block { text-align: left; border: 1px solid var(--win-line); background: var(--card); border-radius: 12px; padding: 9px; display: flex; flex-direction: column; gap: 5px; font: inherit; color: inherit; cursor: pointer }
.pln-block b { font-size: 13px } .pln-block small { color: var(--win-muted); font-size: 10.5px }
.pln-sq { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px }
.pln-sq i { aspect-ratio: 1; border-radius: 2.5px; box-shadow: inset 0 0 0 1px var(--win-line) }
.pln-sq i.pln-f { background: color-mix(in srgb, var(--c) 30%, transparent); box-shadow: none }
.pln-sq i.pln-n { box-shadow: none }
.pln-sq i.pln-t { outline: 1.5px solid var(--s-ok); outline-offset: 1px }
.pln-nums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-items: start }
.pln-num { display: flex; flex-direction: column; gap: 5px; border-radius: 12px; background: var(--card); padding: 9px 10px }
.pln-num > .pln-nt { font-weight: 700; font-size: 13px; color: var(--i-progress) } .pln-num > .pln-nt small { font-weight: 400; color: var(--win-muted); margin-left: 6px }
.pln-sp { display: flex; flex-direction: column; gap: 2px; font-size: 12px }
.pln-sp i { display: block; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--c) 30%, transparent) }
.pln-sp i em { display: block; height: 100%; border-radius: 3px; background: var(--c) }
.pln-load { display: flex; gap: 3px; align-items: flex-end; height: 40px }
.pln-load i { flex: 1; height: 2px; border-radius: 2px; background: color-mix(in srgb, var(--i-progress) 55%, transparent) }
.pln-load i:last-child { height: 38px; background: var(--i-progress) }
.pln-keyrow { display: flex; gap: 10px; align-items: baseline; border-radius: 14px; padding: 7px 11px; background: color-mix(in srgb, var(--i-settings) 10%, transparent) }
.pln-keyrow code { flex: none; min-width: 100px; font-weight: 700; color: var(--i-settings); background: color-mix(in srgb, var(--i-settings) 16%, transparent); border-radius: 8px; padding: 2px 8px }
.pln-keyhead { background: var(--i-settings); color: #fff; border-radius: 16px; padding: 10px 14px }
.pln-keyhead b { font-size: 19px; display: block }
.pln-keyhead span { font-size: 12px; opacity: .92 }

/* ===== 07-bod.css ===== */
/* Chapter 7 — Body. Raspberry is the part's own colour (var(--pc) inside data-part="body"). */
.bod-h1 { text-align: center; cursor: pointer; margin-top: 2px }
.bod-read { text-align: center; min-height: 14px; margin-top: -6px }
.bod-calm { text-align: center }
.bod-capline { flex-wrap: nowrap }
.bod-yes { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600 }
.bod-ysample { display: inline-block; width: 18px; height: 0; border-top: 2px solid color-mix(in srgb, var(--pc) 40%, #000); border-radius: 2px }
.bod-yline { stroke: color-mix(in srgb, var(--pc) 40%, #000) }
.bod-figs { flex-wrap: nowrap; gap: 10px }
.bod-now { display: inline-flex; align-items: baseline; gap: 4px; font-size: 11px; font-weight: 600; white-space: nowrap }
.bod-now b { font-size: 34px; font-weight: 700; line-height: 1 }
.bod-side { display: flex; flex-direction: column; font-size: 10.5px; line-height: 1.3; opacity: .92; min-width: 0 }
.bod-side span { white-space: nowrap }
.bod-curve { position: relative; margin-top: 2px }
.bod-svg { display: block; width: 100%; height: auto; color: #fff }
.bod-tap { position: absolute; top: 12%; height: 76%; border: 0; background: none; cursor: pointer; padding: 0; border-radius: 4px }
.bod-tap:hover { background: rgba(255, 255, 255, .14) }
.bod-card { background: color-mix(in srgb, var(--pc) 11%, var(--win)); border-radius: 12px; padding: 9px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.bod-cap { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; color: var(--pc) }
.bod-tiny { font-size: 10px }
.bod-weekrow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px }
.bod-day { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; min-width: 0 }
.bod-day u { height: 22px; text-decoration: none; color: var(--win-muted) }
.bod-day b { font-weight: 650; font-variant-numeric: tabular-nums }
.bod-day small { color: var(--win-muted); font-size: 10px; font-variant-numeric: tabular-nums }
.bod-mini { width: 100%; height: 22px; border-bottom: 1px solid var(--win-line) }
.bod-today { color: var(--i-today); font-weight: 800 }
.bod-day em, .bod-col em { font-style: normal; font-size: 10px; color: var(--win-muted) }
.bod-day em.bod-today, .bod-col em.bod-today { color: var(--i-today); font-weight: 800 }
.bod-range-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px }
.bod-range { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; background: color-mix(in srgb, var(--pc) 11%, var(--win)); border-radius: 9px; padding: 2px; gap: 2px }
.bod-range button { border: 0; background: none; color: var(--pc); font: inherit; font-size: 11.5px; font-weight: 600; padding: 5px 0; border-radius: 7px; cursor: pointer }
.bod-range button.bod-on { background: var(--pc); color: #fff }
.bod-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px }
.bod-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; min-width: 0;
  background: color-mix(in srgb, var(--pc) 11%, var(--win)); border-radius: 11px; padding: 7px 8px 6px }
.bod-tname { font-size: 9px; font-weight: 700; letter-spacing: .08em; color: var(--pc); white-space: nowrap }
.bod-fig { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap }
.bod-fig b { font-size: 17px; font-weight: 700 }
.bod-fig span { font-size: 10.5px; font-weight: 600 }
.bod-note { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.bod-bars { position: relative; display: flex; align-items: flex-end; gap: 3px; height: 50px; width: 100%; margin-top: 5px; padding-top: 0 }
.bod-bars.bod-four { gap: 6px; justify-content: center }
.bod-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; z-index: 1 }
.bod-four .bod-col { flex: 0 1 22px }
.bod-col b { display: block; width: 100%; background: var(--pc); border-radius: 3px; margin-bottom: 0 }
.bod-col u { text-decoration: none; font-size: 10px; color: var(--win-muted); margin-bottom: 12px }
.bod-col em { height: 12px; line-height: 12px; white-space: nowrap }
.bod-col b { max-height: calc(100% - 12px) }
.bod-norm { position: absolute; left: 0; right: 0; margin-bottom: 12px; border: 1px solid color-mix(in srgb, var(--win-muted) 55%, transparent); border-radius: 4px; z-index: 0 }
.bod-norm i { font-style: normal; font-size: 8px; color: var(--win-muted); padding-left: 3px }
.bod-sharebox { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding-top: 2px }
.bod-share { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--pc); color: #fff; border: 0; border-radius: 20px; font: inherit; font-weight: 650; padding: 8px 20px; cursor: pointer }
.bod-share svg { width: 15px; height: 15px }
.bod-wide { width: 100%; border-radius: 10px }
.bod-foot { margin-top: 4px }
.bod-msg { text-align: center; padding: 12px 10px; gap: 10px }
.bod-prow { display: flex; align-items: baseline; gap: 12px; padding: 5px 0; border-top: 1px solid var(--win-line) }
