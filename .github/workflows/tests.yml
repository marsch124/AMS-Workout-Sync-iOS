name: Tests

# Every push runs the UI tests. A red run means the build is not fit to
# upload to TestFlight. The tests find every control by accessibility
# identifier, never by its words, and open a small invented workbook
# (UITests/Fixtures/plan.xlsx) on a fixed day — never his real plan.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show what we are building with
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # 20 Nov 2026: GitHub's runner got a new Xcode (26.6) with NO iPhone simulator, and the
      # tests stopped before they began. Keep the Xcode in use if it has an iPhone; otherwise
      # take the newest Xcode that has one. (Same fix as AMS Manual Expenses 9e6e778.)
      - name: Use an Xcode that has an iPhone simulator
        run: |
          has_iphone() { xcodebuild -showdestinations -project AMSWorkoutSync.xcodeproj -scheme AMSWorkoutSync 2>/dev/null | grep -q "platform:iOS Simulator, .*name:iPhone"; }
          if has_iphone; then echo "Keeping $(xcode-select -p)"; xcodebuild -version; exit 0; fi
          for XC in $(ls -d /Applications/Xcode*.app | sort -V -r); do
            sudo xcode-select -s "$XC"
            if has_iphone; then echo "Using $XC"; xcodebuild -version; exit 0; fi
            echo "No iPhone simulator with $XC"
          done
          echo "::error::no Xcode on this runner has an iPhone simulator"
          exit 1

      - name: Pick a simulator the runner actually has
        run: |
          # The highest-numbered iPhone: present on the runner image, and predictable.
          LINE=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone [0-9]" | sort -V | tail -1)
          if [ -z "$LINE" ]; then
            LINE=$(xcrun simctl list devices available | grep -E "^ +iPhone" | tail -1)
          fi
          UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "Using simulator:$(echo "$LINE" | sed -E 's/ *\(.*//')"

      # Seconds, no simulator: the reading and writing logic on its own.
      - name: Model tests
        run: swift test --package-path Core

      # Weeks of use against the invented workbook: logging, missed marks,
      # moves, extras and a conflict, then the file checked cell by cell.
      - name: Soak the sync engine
        run: |
          swift build -c release --package-path Core --product soak
          Core/.build/release/soak UITests/Fixtures/plan.xlsx "$RUNNER_TEMP/soak" 3

      - name: UI tests
        # A runner whose simulator never starts used to hang until the job's 30 minutes ran out (25 Nov 2026).
        timeout-minutes: 20
        run: |
          xcodebuild test \
            -project AMSWorkoutSync.xcodeproj \
            -scheme AMSWorkoutSync \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Keep the results when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
